<!doctype html>
<html><head><meta charset="utf-8">
<!-- ===========================================================================
     Race Through Time - the RTT player.  Format RTT-1, IQ-04, 28 Sep 2026.

     COPIED from Market Marathon's player_formatc2.html (Format C2-2), as shipped in
     MarketMarathon_RaceKit_RF_US_C2_v3.zip, marketmarathon/bars @ 2a10877
     (sha256 39e32a54...64b7 in that kit's dataset_hashes.txt). The C2-2 file itself is
     never edited for RTT (DEC-002); this is a separate copy.

     Kept from C2-2: the 1920x1080 drawing space scaled by RASTER; the navy look and its
     three neutral levels; Archivo; the board geometry (bars end at x 1150, names on the bars
     and allowed to overflow, the value past whichever is longer, one name size for the whole
     video); darkenForWhite(); tabular digits; the eased rank glide (0.55 s) with the fading
     eleventh row; the name pad during overtakes; the intro and closing card beats.

     Changed for RTT (prompts/CODE_SESSION_IQ-04.md step 3):
       a. value labels are whole numbers with a unit word ("106 wins", "1 win"). No bn/tn,
          no currency symbol, no decimals, no USD bracket. The axis steps by whole numbers.
       b. a count STEPS at its event and never shows an in-between value. Only the bar's
          LENGTH glides (glide.bar_sec) and its row glides (glide.rank_sec).
       c. no country flags, no sub-sector icons, no merger lineage/rename rows, no year
          plates. Colours come from the config palette, one per driver, in data order.
       d. the time label is season + Grand Prix + date, drawn bottom-right of the board,
          and the event timing comes from rtt_timeline.js (adaptive pacing, 0.8-1.4x).
       e. ties: equal counts rank by who reached that count first (rtt_timeline.js).
       f. every RTT word, colour and number comes from config.json through setup().

     Changed in IQ-05 (DEC-022 to DEC-025):
       - colours: one per driver for the whole dataset, from rtt_timeline.js assignColours()
         (no two drivers who can be on screen together share a colour or get similar ones);
         darkenForWhite() now lives there as drawnColour(), unchanged.
       - sizes: the axis numbers, date and footer take their px from config "sizes" (C2-2's
         20 / 28 / 17 when the key is absent), enlarged for RTT so they read on a phone.
       - entering rows: a driver joining the board starts its slide just under the last row and
         glides in with glide.entry_sec, so it is clearly visible within 8 frames of its race.
     Changed in IQ-05 round 2 (DEC-027 to DEC-033), all switched by config, so config.json draws
     exactly as before:
       - board: "board" {bar_gap, name_frac, value_frac} sets the gap between bars and how much
         of a bar the name and value text may fill (C2-2's 22 px / 0.56 / 0.54 when absent), so a
         20-row board can keep its text as large as the rows allow.
       - winner highlight: "highlight" {enabled, sec, mix, glow}. On the first frame of a race each
         credited winner whose bar is on the board is brightened towards white and given a soft
         glow, fading out over highlight.sec. A driver who also wins the next race stays lit
         through the streak rather than fading and re-lighting (no flicker).
       - winner line: "winner_line" {enabled} adds "Won by <driver> · <n> wins" under the date
         (every credited driver on a shared drive), and lifts the time label to make room.
     Changed in IQ-05 round 3 (DEC-034 to DEC-044), all switched by config, so config.json draws
     exactly as before:
       - flags: "flags" {enabled, column, height_frac, gap, csv}. Each driver's nationality flag
         (data/rtt-002/driver_nationality.csv; flag-icons SVGs loaded by rtt.js, never committed)
         in a narrow column just left of the bars, moving with its row. column true keeps the
         column's space even while enabled is false, so the layout does not change when the
         flags are switched on. A driver without a flag file gets none; the name is always drawn.
       - event label: "event_label" {enabled, fade_sec}. A winner on the board gets
         "· <Grand Prix>" (GP short form, rtt_timeline.js gpShort) after its value from the first
         frame of the race; it stays until the next race lands, then fades over fade_sec.
       - time block: time_label.mode "block" {x, date_y, align} draws the season, Grand Prix and
         date at a fixed place next to the board instead of the bottom-right corner.
       - overlays (DEC-035): "overlays" [{name, file, x, y, w, h}] reserves a box per picture (Luke's
         logo top right, a generic car bottom right). rtt.js loads each file from the git-ignored
         kits/rtt-002/local_assets/ if it is there; the picture is drawn fitted inside its box
         (aspect kept, centred). A missing file draws nothing and the render goes on. The box is
         reserved either way, and the tests check nothing else ever enters it.
     Changed in IQ-05 round 4 (DEC-045 to DEC-050), all switched by config, so config.json draws
     exactly as before:
       - date line: time_label.mode "line" {x, y, align, size} replaces the season / Grand Prix /
         date block with ONE small line, "25 October 2020 · Portuguese GP", next to the title. It
         names the race on screen on every frame, including races won by a driver off the board.
       - event label date: event_label.date true adds the race date after the Grand Prix
         ("92 wins · Portuguese GP · 25 October 2020"), in the same "D Month YYYY" form.
       - overlays: the axis grid lines stop short of every reserved overlay box (with the gap
         overlay_gap), so nothing at all is drawn inside a box except its picture. Grid segments are
         recorded in window.__GRID for the tests.
     Changed in IQ-05 round 5 (DEC-053), switched by config, so config.json draws exactly as before:
       - stats label: "stats_label" {enabled} puts wins, starts and win rate after EVERY bar on the
         board: "91 wins · 306 starts · 29.7%" ("1 win", "1 start"). The win count ("91 wins", the
         value label) is bold; "· 306 starts · 29.7%" follows in the caption grey. Starts come from
         the race file (adapter 1.1, events[].starts); the rate is rtt_timeline.js rateText (one
         decimal, rounded half up). All three numbers step only at a race, like the wins. It
         replaces the event label (the player refuses the two together); the date line still names
         every race. Recorded in window.__LABELS as kind "stats".
     Changed in IQ-10 (RTT-003 design pilot, DEC-085 and DEC-103 onwards), only for a quarter-end series
     ("rtt-series/1", scripts/rtt003_adapter.py) or behind new config keys, so every RTT-002 config draws
     exactly as before (checked frame by frame against main):
       - values: millions with one decimal, rounded half up from whole units ("118.7m"), "+" where the
         data flags a lower bound; the axis steps in whole millions (axis_suffix "m").
       - pictures: "pictures" {enabled, height_frac, aspect, gap}: one console picture per bar in a column
         left of the bars (private icons, loaded by rtt.js; never committed), fitted inside its box.
       - maker colours: one colour per maker (rtt_timeline.js buildSeries, maker_order -> palette).
       - estimated look (DEC-090, DEC-084): display_style "estimated" bars carry dark diagonal stripes;
         "analyst_estimate" bars are drawn half-strength with a dashed outline and "· analyst estimate"
         after the value.
       - fade: "fade" {enabled, alpha, text_alpha, sec}: from its fade quarter end a retired console's
         bar and picture fade to alpha, its text to text_alpha (DEC-086, DEC-093).
       - crown: "crown" {enabled, colour}: a crown after the leader's value.
       - callout: "callout" {enabled, sec, y, size}: at each change of first place, one line under the
         title ("NES becomes the best-selling console ever ..."), for callout.sec.
       - maker key: "maker_key" {enabled, x, bottom, w, ...}: a panel with each maker's colour, logo and
         name, and a legend for the estimated look and the crown; scoreboard true adds each maker's total.
       - bar notes: "bar_notes" [{id, mark, text}]: a mark after that console's value and the note on the
         callout line (the PS2 note candidate, DEC-094; stills only).
       - glide.bar_mode "beat": a bar's length moves in a straight line over its whole quarter instead of
         easing over glide.bar_sec (values still step only at the quarter end).
     Changed in IQ-10 round 2 (Luke, DEC-114 onwards), series only:
       - count {enabled}: the numbers COUNT. Quarter k's bars and value labels move together on a straight
         line from quarter k-1's figures and land on the exact series.csv value on the quarter-end frame
         (rtt_timeline.js seriesFrame); the order, the crown and the scoreboard follow the counted figures,
         so an overtake shows on the frame where the numbers cross.
       - bar_logos {enabled, height_frac, aspect, gap, pad}: the maker's logo on a light tile right beside
         each console picture.
       - pictures.tall_frac: a portrait picture may use up to that much more height than the box, so the
         tall consoles do not look narrow (sizing only; no picture changed).
       - moments: callouts at every change of first place and at the configured extra moments, on the
         frame where the counted figures cross (rtt_timeline.js); final_line and final_footnote: one line
         and a small footnote under the title on the final table only (the footnote's mark after its
         console's value, final table only).
     Removed as unused: the Format C / C2-1 picture column and story cards, the prototype
     driver block that followed </html> in the C2-2 file.

     Test hook: every text label drawn in a frame is recorded in window.__LABELS
     ({kind, id, text, x, y, w, size, alpha, tab, asc, desc, weight}; tab = drawn on fixed-pitch
     digits, asc/desc = the ink's height above and below the baseline, weight = font weight), each bar's row position,
     opacity, highlight and drawn rectangle in window.__BARS, each flag drawn in window.__FLAGS
     ({id, code, x, y, w, h, alpha}), each axis grid segment in window.__GRID ({x, y, w, h}) and
     the target order in window.__RANK. Drawing does not
     depend on them.
     =========================================================================== -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="rtt_timeline.js"></script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
/* Everything below draws in a 1920x1080 coordinate space. RASTER scales the real canvas up
   so a 4K master is the same drawing at twice the device pixels (C2-2 unchanged). */
let RASTER=1;
function setRaster(r){ RASTER=r||1; cv.width=1920*RASTER; cv.height=1080*RASTER; }
function baseTransform(){ ctx.setTransform(RASTER,0,0,RASTER,0,0); }

/* The C2-2 looks, byte-for-byte in their values. RTT defaults to navy (config "look"); a
   quieter variant can name another key or pass look_overrides in its own config. */
const LOOKS = {
  charcoal: { ground:'#0b0e14', panel:'#141922', ink:'#ffffff', muted:'#8d97a8', axis:'#69738a',
              accent:'#ffc933', hairline:'rgba(255,255,255,0.16)', grid:'rgba(255,255,255,0.05)', foot:'#5c657a' },
  navy:     { ground:'#0b1424', panel:'#152134', ink:'#F4F6FA', muted:'#8492A6', cap:'#AAB3C2',
              axis:'#8492A6', accent:'#F4F6FA', rule:'#2FD0C8',
              hairline:'rgba(244,246,250,0.14)', grid:'rgba(244,246,250,0.055)', foot:'#4A5563' },
  espresso: { ground:'#14100c', panel:'#1f1a14', ink:'#f6efe3', muted:'#a39682', axis:'#8b7f6d',
              accent:'#f0c987', hairline:'rgba(255,236,205,0.16)', grid:'rgba(255,236,205,0.05)', foot:'#7d7263' },
  slate:    { ground:'#101820', panel:'#19242e', ink:'#f4f8fa', muted:'#93a3b0', axis:'#72848f',
              accent:'#4fd1c5', hairline:'rgba(255,255,255,0.15)', grid:'rgba(255,255,255,0.05)', foot:'#647684' }
};

let FONT='"Archivo"';
let T=LOOKS.navy, CFG=null, TL=null, FPS=30;
let ENT={}, NROWS=10;
let LEFT=64, RIGHT=64, GAPBAR=12, VALW=260, BAREND=0, NAMESCALE=1, VALOUT=false, NAMEOVERFLOW=false;
let NAMEMODE='bar', YEARSIZE=112;
let RACE_SEC=0, RACE_FRAMES=0, INTRO_SEC=3.0;
let NAME_PX=null, NAME_TRUNC=false;
let SZ={axis:20, date:28, footer:17};
let BOARD={bar_gap:22, name_frac:0.56, value_frac:0.54}, HL=null, WINLINE=null;
let FLAGCOL=null, FLAGS=false, FLAGIMG={}, FLAGCODE={}, EVL=null, OVL=[], OVLGAP=0, STATS=false;
/* IQ-10 (RTT-003): all null / false for RTT-002 */
let COUNT=false, BLOGO=null, FFOOT=null, FINAL_ON=false;
let SERIES=false, PIC=null, PICIMG={}, LOGOIMG={}, MKEY=null, FADE=null, CROWN=null, CALLOUT=null, NOTES=null, GLIDE_BEAT=false, AXU=1, MAKERS=[], MAKERNAME={};
let TOP=150; const BOTTOM=1080-46;            // IQ-10: TOP from config board_top (RTT-003); 150 for RTT-002

/* ---- the test hook: what text went on the frame ---- */
window.__LABELS=[]; window.__RANK=[]; window.__EVENT=null; window.__BARS=[]; window.__FLAGS=[]; window.__GRID=[];
window.__PICS=[]; window.__CROWN=null; window.__KEY=null; window.__CALLOUT=null; window.__LOGOS=[]; window.__FINAL=null;
function note(kind,id,text,x,y,align,w,tab){
  const x0 = align==='right' ? x-w : align==='center' ? x-w/2 : x;
  const m=/(\d+)px/.exec(ctx.font), mt=ctx.measureText(text);
  const wt=/(?:^|\s)(bold|\d{3})\s/.exec(ctx.font);                  // Chrome may say "bold" for 700
  window.__LABELS.push({kind,id,text,x:x0,y,w,size:m?+m[1]:null,alpha:ctx.globalAlpha,tab:!!tab,
                        asc:mt.actualBoundingBoxAscent, desc:mt.actualBoundingBoxDescent, weight:wt?(wt[1]==='bold'?700:+wt[1]):400});
}
function text(kind,id,str,x,y,align){
  ctx.textAlign=align||'left'; ctx.fillText(str,x,y);
  note(kind,id,str,x,y,align||'left',ctx.measureText(str).width);
}

function setup(o){
  setRaster(o.raster||1);
  CFG=o.cfg; FPS=CFG.fps; NROWS=CFG.rows||10; INTRO_SEC=CFG.intro_sec;
  if(CFG.fonts && CFG.fonts.family) FONT='"'+CFG.fonts.family+'"';
  TL=RTT_TIMELINE.build(o.data, CFG);
  RACE_FRAMES=TL.raceFrames; RACE_SEC=RACE_FRAMES/FPS;
  T=Object.assign({}, LOOKS[CFG.look]||LOOKS.navy, CFG.look_overrides||{});
  NAMEMODE=CFG.namemode||'bar'; NAMESCALE=CFG.namescale||1; VALOUT=!!CFG.valout;
  NAMEOVERFLOW=!!CFG.nameoverflow; YEARSIZE=CFG.yearsize||112; BAREND=CFG.barend||0;
  LEFT = CFG.left!=null ? CFG.left : 64;
  /* C2-2 sets the right margin from barend BEFORE it reads valw, so with the shipped tokens
     (barend 1150, valw 260) its bars end at x 1140, not 1150. Kept exactly, so the default
     board lands on the same pixels as C2-2's. */
  RIGHT = BAREND ? 1920-250-BAREND : (CFG.right!=null ? CFG.right : 64);
  VALW = CFG.valw!=null ? CFG.valw : 250;
  SZ=Object.assign({axis:20, date:28, footer:17, winner:34}, CFG.sizes||{});
  BOARD=Object.assign({bar_gap:22, name_frac:0.56, value_frac:0.54}, CFG.board||{});
  HL = CFG.highlight && CFG.highlight.enabled ? Object.assign({sec:0.4, mix:0.3, glow:22}, CFG.highlight) : null;
  WINLINE = CFG.winner_line && CFG.winner_line.enabled ? CFG.winner_line : null;
  if(WINLINE && CFG.time_label.mode==='line') throw new Error('winner_line needs time_label mode "board" or "block"; the date line (mode "line") has no room for it');
  /* IQ-05c: flags, event label */
  const F=CFG.flags||{};
  FLAGCOL = (F.enabled||F.column) ? Object.assign({height_frac:0.9, gap:10}, F) : null;
  FLAGS = !!F.enabled; FLAGIMG={}; FLAGCODE={};
  const loads=[];
  if(FLAGS){
    if(!o.flags) throw new Error('flags.enabled but no flag images were passed to setup()');
    for(const [id,code] of Object.entries(o.flags.byId)){
      FLAGCODE[id]=code;
      if(!FLAGIMG[code]){ const im=new Image(); im.src=o.flags.svg[code]; FLAGIMG[code]=im; loads.push(im.decode()); }
    }
  }
  OVL=(CFG.overlays||[]).map(b=>{
    const src=o.overlays && o.overlays[b.name], im=src ? new Image() : null;
    if(im){ im.src=src; loads.push(im.decode()); }
    return Object.assign({}, b, {img:im});
  });
  OVLGAP = CFG.overlay_gap!=null ? CFG.overlay_gap : 0;
  window.__imagesReady=Promise.all(loads).then(()=>Object.keys(FLAGIMG).length);
  EVL = CFG.event_label && CFG.event_label.enabled ? Object.assign({fade_sec:0.3}, CFG.event_label) : null;
  /* IQ-05e stats label: needs starts in the race file; replaces the event label */
  STATS = !!(CFG.stats_label && CFG.stats_label.enabled);
  if(STATS && !TL.hasStarts) throw new Error('stats_label.enabled but the race file has no starts (rebuild it with scripts/rtt_adapter.py and data/rtt-002/starts.csv)');
  if(STATS && EVL) throw new Error('stats_label replaces the event label; switch event_label off');
  /* IQ-10 (RTT-003): series mode and its switches */
  TOP = CFG.board_top!=null ? CFG.board_top : 150;
  SERIES = !!TL.series; AXU = SERIES ? 1e6 : 1;
  GLIDE_BEAT = !!(CFG.glide && CFG.glide.bar_mode==='beat');
  const PC=CFG.pictures||{};
  PIC = PC.enabled ? Object.assign({height_frac:0.92, aspect:1.65, gap:14}, PC) : null; PICIMG={}; LOGOIMG={};
  if(PIC){
    if(!o.pictures) throw new Error('pictures.enabled but no pictures were passed to setup()');
    for(const [id,src] of Object.entries(o.pictures)){ const im=new Image(); im.src=src; PICIMG[id]=im; loads.push(im.decode()); }
  }
  for(const [k,src] of Object.entries(o.logos||{})){ const im=new Image(); im.src=src; LOGOIMG[k]=im; loads.push(im.decode()); }
  COUNT = SERIES && !!(CFG.count && CFG.count.enabled);
  BLOGO = SERIES && CFG.bar_logos && CFG.bar_logos.enabled ? Object.assign({height_frac:0.8, aspect:2.0, gap:8, pad:3}, CFG.bar_logos) : null;
  FFOOT = SERIES && CFG.final_footnote && CFG.final_footnote.enabled ? Object.assign({mark:'*', size:26, dy:34}, CFG.final_footnote) : null;
  MKEY = CFG.maker_key && CFG.maker_key.enabled ? Object.assign({x:1256, bottom:950, w:600, row_h:46, size:26, legend:true, scoreboard:false, logo_w:112, logo_h:34, pad:14}, CFG.maker_key) : null;
  FADE = CFG.fade && CFG.fade.enabled ? Object.assign({alpha:0.4, text_alpha:0.7, sec:0.6}, CFG.fade) : null;
  CROWN = CFG.crown && CFG.crown.enabled ? Object.assign({colour:'#F5C542'}, CFG.crown) : null;
  CALLOUT = CFG.callout && CFG.callout.enabled ? Object.assign({sec:3.0, y:116, size:30, fade_in:0.25, fade_out:0.4}, CFG.callout) : null;
  NOTES = Array.isArray(CFG.bar_notes) && CFG.bar_notes.length ? CFG.bar_notes : null;
  MAKERS = SERIES ? (CFG.maker_order||[]) : []; MAKERNAME = {};
  if(SERIES) for(const m of TL.makers) MAKERNAME[m.key] = (CFG.maker_names && CFG.maker_names[m.key]) || m.label;
  if(SERIES && (STATS||EVL||HL||WINLINE||FLAGS)) throw new Error('a console series has no wins: switch off stats_label, event_label, highlight, winner_line and flags');
  window.__imagesReady=Promise.all(loads).then(()=>Object.keys(FLAGIMG).length);
  /* colours: one per driver for the whole dataset (rtt_timeline.js assignColours, computed on
     the whole race file, not the window), so a passage and the full video agree. */
  ENT={}; const pal=CFG.palette;
  o.data.entrants.forEach(e=>{ ENT[e.id]={id:e.id,label:(CFG.labels&&CFG.labels[e.id])||e.label,colour:pal[TL.colours.index[e.id]],_y:null,maker:e.maker}; });
  NAME_PX=null; NAME_TRUNC=false;
}
window.setup=setup;

const lerp=(a,b,f)=>a+(b-a)*f;
const ease=u=>u<=0?0:u>=1?1:u*u*(3-2*u);

/* Every label on a bar is white; a palette colour too light for white type is darkened,
   keeping its hue (C2-2's function, unchanged, now shared from rtt_timeline.js so the colour
   rule is judged on the colour actually drawn). */
const darkenForWhite=h=>RTT_TIMELINE.drawnColour(h);
/* the highlight: the bar's colour moved part of the way towards white */
function mixWhite(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v+(255-v)*a)).join(',')+')';
}

/* (a) whole numbers with a unit word. The count is an integer by construction (the adapter
   refuses anything else); Math.round here is a guard, and a non-integer is logged loudly. */
function fmt(n){
  if(!Number.isInteger(n)) console.error('NON-INTEGER COUNT '+n);
  const v=Math.round(n);
  return v.toLocaleString('en-GB')+' '+(v===1 ? (CFG.unit_singular||CFG.unit) : CFG.unit);
}
/* IQ-10: units -> "118.7m" (millions, one decimal, rounded half up on the whole units, done on
   integers), "+" for a lower bound. 1,000m and over get a thousands separator. */
function millions(u){
  if(!Number.isInteger(u) || u<0) console.error('BAD UNITS '+u);
  const t=Math.floor((u+50000)/100000);
  return Math.floor(t/10).toLocaleString('en-GB')+'.'+(t%10)+'m';
}
function fmtS(u,plus,id){
  const n=NOTES && NOTES.find(x=>x.id===id);
  return millions(u)+(plus?'+':'')+(n?n.mark:'');
}
/* IQ-05e: "· 306 starts · 29.7%" (the part after the bold win count) */
function statsText(w,s){
  return '· '+s.toLocaleString('en-GB')+' '+(s===1?'start':'starts')+' · '+RTT_TIMELINE.rateText(w,s)+'%';
}
/* The axis steps in whole units only: 1, 2, 5, 10, 20, 25, 50 ... never 0.5 or 2.5. */
function niceStepInt(v){
  if(v<=1) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  for(const m of [1,2,2.5,5,10]){ const s=m*p; if(v<=s && Number.isInteger(s)) return s; }
  return 10*p;
}
/* Archivo's digits are not the same width, and canvas cannot switch on tabular figures, so
   every digit is drawn on the width of the widest one (C2-2 unchanged). */
function pitch(){ let w=0; for(const d of '0123456789') w=Math.max(w,ctx.measureText(d).width); return w; }
function tabWidth(str,p){ let t=0; for(const ch of str) t+= (ch>='0'&&ch<='9')?p:ctx.measureText(ch).width; return t; }
function tabText(str,x,y,align,kind,id){
  const p=pitch(), total=tabWidth(str,p);
  let cx = align==='right' ? x-total : align==='center' ? x-total/2 : x;
  const x0=cx, keep=ctx.textAlign; ctx.textAlign='left';
  for(const ch of str){
    if(ch>='0'&&ch<='9'){ ctx.fillText(ch, cx+(p-ctx.measureText(ch).width)/2, y); cx+=p; }
    else { ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width; }
  }
  ctx.textAlign=keep;
  if(kind) note(kind,id,str,x0,y,'left',total,true);
  return total;
}
function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---- geometry shared by the name sizing and the frame ---- */
function geom(){
  const ROWH=(BOTTOM-TOP-14)/NROWS, BARH=ROWH-(NAMEMODE==='above'?40:BOARD.bar_gap);
  const NAMEF=Math.round(Math.min(38,BARH*BOARD.name_frac)), VALF=Math.round(Math.min(36,BARH*BOARD.value_frac));
  /* IQ-05c: the flag column (4:3, as flag-icons draws them) sits between the left margin and the
     bars; the bars start after it. */
  const FH = FLAGCOL ? Math.round(BARH*FLAGCOL.height_frac) : 0, FW = Math.round(FH*4/3);
  /* IQ-10: the picture column (box PW x PH, the row's height x height_frac, aspect PIC.aspect) */
  const PH = PIC ? Math.round(ROWH*PIC.height_frac) : 0, PW = PIC ? Math.round(PH*PIC.aspect) : 0;
  /* IQ-10 round 2: the maker-logo tile (LW x LH) right of the picture */
  const LH = BLOGO ? Math.round(PH*BLOGO.height_frac) : 0, LW = BLOGO ? Math.round(LH*BLOGO.aspect) : 0;
  const x0 = PIC ? LEFT+PW+(BLOGO?BLOGO.gap+LW:0)+PIC.gap : FLAGCOL ? LEFT+FW+FLAGCOL.gap : LEFT+GAPBAR, W=1920-RIGHT-VALW-x0;
  return {ROWH,BARH,NAMEF,VALF,x0,W,FH,FW,PH,PW,LH,LW};
}

/* ONE name size for the whole video (C2-2's rule: two bars at different sizes reads as a
   mistake). In C2-2 the name column never overflowed the frame because company names are
   short; drivers can have long names, so the size is also stepped down until the longest name
   that ever reaches the board, plus its value label, fits inside the frame's right margin.
   Only if 20px is still too wide is a name shortened with an ellipsis, and that is logged. */
function nameSize(){
  if(NAME_PX!=null) return NAME_PX;
  const g=geom(), base=Math.round(g.NAMEF*NAMESCALE);
  const seen={}, seenS={};
  const take=s=>{ s.order.slice(0,NROWS+1).forEach(id=>{ seen[id]=Math.max(seen[id]||0,s.totals[id]);
    if(STATS){ ctx.font='500 '+g.VALF+'px '+FONT; seenS[id]=Math.max(seenS[id]||0, g.VALF*0.35+tabWidth(statsText(s.totals[id],s.starts[id]),pitch())); } }); };
  take(TL.opening); TL.states.forEach(take);
  const ids=Object.keys(seen);
  ctx.font=(STATS?'700 ':'600 ')+g.VALF+'px '+FONT; const p=pitch();
  /* IQ-10: in a series the value is "118.7m+" (widest case: plus and any note mark), then maybe
     "· analyst estimate", then maybe the crown */
  let everA={}, estW=0;
  if(SERIES){ [TL.opening].concat(TL.states).forEach(s=>s.order.slice(0,NROWS+1).forEach(id=>{ if(s.style[id]==='analyst_estimate') everA[id]=true; }));
    ctx.font='500 '+g.VALF+'px '+FONT; estW=g.VALF*0.35+tabWidth('· analyst estimate',pitch()); ctx.font=(STATS?'700 ':'600 ')+g.VALF+'px '+FONT; }
  const valOf=id=>SERIES ? tabWidth(fmtS(seen[id],true,id)+(FFOOT&&FFOOT.id===id?FFOOT.mark:''),p)+(everA[id]?estW:0)+(CROWN?g.VALF*1.6:0)
                         : tabWidth(fmt(seen[id]),p)+(seenS[id]||0);   // IQ-05e: plus the stats label
  const nx=g.x0+18, limit=1920-64;
  let f=base;
  for(;f>=20;f--){
    ctx.font='600 '+f+'px '+FONT;
    if(ids.every(id=>nx+ctx.measureText(ENT[id].label).width+18+valOf(id)<=limit)) break;
  }
  if(f<20){ f=20; NAME_TRUNC=true; console.error('NAME TOO LONG even at 20px: shortened with an ellipsis. Shorten the display name in the dataset.'); }
  if(f<base) console.log('NAME SIZE stepped down from '+base+'px to '+f+'px to fit the longest name on the frame');
  return NAME_PX=f;
}
function fitName(nm,maxw){
  if(!NAME_TRUNC || ctx.measureText(nm).width<=maxw) return nm;
  let s=nm; while(s.length>1 && ctx.measureText(s+'…').width>maxw) s=s.slice(0,-1);
  return s+'…';
}

/* ---- (d) the time label: season, Grand Prix, date ---- */
function dateText(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return d+' '+CFG.time_label.months[m-1]+' '+y;
}
/* IQ-05d date line and dated event label: "25 October 2020 · Portuguese GP" */
function lineText(ev){ return SERIES ? dateText(ev.date) : dateText(ev.date)+' · '+RTT_TIMELINE.gpShort(ev.grand_prix); }
function eventText(e){ return RTT_TIMELINE.gpShort(e.grand_prix)+(EVL.date && e.date ? ' · '+dateText(e.date) : ''); }
/* IQ-05b winner line: every credited driver of the race shown, with the career total the data
   gives them after it ("Won by Daniel Ricciardo · 7 wins"; both drivers on a shared drive). */
function winnerText(ev){

function drawTime(ev){
  const TLB=CFG.time_label;
  if(TLB.mode==='title' || !ev) return;
  /* "line" (IQ-05d, DEC-045 (3)): one small line, date first, then the Grand Prix, at
     time_label.x / y. Every frame names the race it shows, whoever won it. */
  if(TLB.mode==='line'){

    return;
  }
  /* "board" (C2-2's place): right-aligned at the frame's right margin, date on y 1018.
     "block" (IQ-05c): anchored at time_label.x (align left or right) with the date on
     time_label.date_y, so the block can sit next to the board. Same line spacing in both. */
  const block = TLB.mode==='block';

  const lift = WINLINE ? SZ.winner+8 : 0;      // make room for the winner line under the date

  }
  if(WINLINE && ev.credits && ev.credits.length){
    ctx.fillStyle=T.ink; ctx.font='600 '+SZ.winner+'px '+FONT;
    tabText(winnerText(ev), R, DY+lift, AL, 'winner', null);

}

/* ---- the opening card (C2-2's, without the flag or the Market Marathon logo) ---- */
function spacedCentre(str,x,y,extra){
  if('letterSpacing' in ctx){
    const was=ctx.letterSpacing; ctx.letterSpacing=extra+'px';
    ctx.fillText(str,x+extra/2,y); ctx.letterSpacing=was; return;
  }
  let w=0; for(const ch of str) w+=ctx.measureText(ch).width+extra;
  w-=extra; let cx=x-w/2;
  for(const ch of str){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+extra; }
}
function fitFont(weight,size,str,maxw){
  while(size>28){ ctx.font=weight+' '+size+'px '+FONT;
    if(ctx.measureText(str).width<=maxw) return size; size-=2; }
  return size;
}
function drawIntro(u){

window.drawIntro=drawIntro;

/* A 1 px axis grid line from y0 to y1, broken where it would cross a reserved overlay box
   (IQ-05d): the box, widened by OVLGAP, is left empty. Segments go to window.__GRID. */
function gridLine(x,y0,y1){
  let segs=[[y0,y1]];
  for(const b of OVL){
    if(x+1<=b.x-OVLGAP || x>=b.x+b.w+OVLGAP) continue;
    const t=b.y-OVLGAP, u=b.y+b.h+OVLGAP, next=[];
    for(const [a,z] of segs){ if(z<=t || a>=u){ next.push([a,z]); continue; }
      if(a<t) next.push([a,t]); if(z>u) next.push([u,z]); }
    segs=next;
  }
  for(const [a,z] of segs){ ctx.fillRect(x,a,1,z-a); window.__GRID.push({x,y:a,w:1,h:z-a}); }
}

/* ---- IQ-10 (RTT-003) helpers; only called in a quarter-end series ---- */
function mixGround(hex,a){                       // the colour moved part of the way to the ground
  const n=parseInt(hex.slice(1),16), g=parseInt(T.ground.slice(1),16);
  return 'rgb('+[16,8,0].map(b=>Math.round(((n>>b)&255)*(1-a)+((g>>b)&255)*a)).join(',')+')';
}
/* The estimated look (DEC-090): "estimated" = the maker colour with dark diagonal stripes;
   "analyst_estimate" (DEC-084) = the colour at half strength with a dashed outline. */
function drawStyledBar(x,y,w,h,colour,st){
  if(st==='analyst_estimate'){
    ctx.fillStyle=mixGround(colour,0.5); rr(x,y,w,h,2); ctx.fill();
    if(w>4){ ctx.save(); ctx.setLineDash([9,6]); ctx.lineWidth=2.5; ctx.strokeStyle=mixWhite(colour,0.3);
      rr(x+1.25,y+1.25,w-2.5,h-2.5,2); ctx.stroke(); ctx.restore(); }
    return;
  }
  ctx.fillStyle=colour; rr(x,y,w,h,2); ctx.fill();
  if(st==='estimated'){
    ctx.save(); rr(x,y,w,h,2); ctx.clip();
    ctx.strokeStyle='rgba(6,10,18,0.45)'; ctx.lineWidth=5; ctx.beginPath();
    for(let t=-h;t<w;t+=14){ ctx.moveTo(x+t,y+h); ctx.lineTo(x+t+h,y); }
    ctx.stroke(); ctx.restore();
  }
}
function drawCrown(x,y,w,h,col){
  ctx.save(); ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(x,y+h); ctx.lineTo(x,y+h*0.32); ctx.lineTo(x+w*0.27,y+h*0.62); ctx.lineTo(x+w*0.5,y+h*0.12);
  ctx.lineTo(x+w*0.73,y+h*0.62); ctx.lineTo(x+w,y+h*0.32); ctx.lineTo(x+w,y+h); ctx.closePath(); ctx.fill();
  for(const [px,py] of [[x,y+h*0.32],[x+w*0.5,y+h*0.12],[x+w,y+h*0.32]]){ ctx.beginPath(); ctx.arc(px,py,h*0.1,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
/* Retired consoles (DEC-086, DEC-093): 1 until the console's fade quarter end, then down to FADE.alpha
   over FADE.sec. TL.fade[id]: window event index, -1 = already faded at the opening, null = never. */
function fadeOf(id,k,fr){
  if(!FADE || !SERIES) return 1;
  const f=TL.fade[id];
  if(f==null) return 1;
  if(f===-1) return FADE.alpha;
  if(k<f) return 1;
  return 1-(1-FADE.alpha)*ease((fr-TL.startFrame[f])/Math.max(1,FADE.sec*FPS));
}
/* Callouts: only at a change of first place (TL.records), for CALLOUT.sec from its quarter end. */
function calloutAt(fr){
  if(!CALLOUT || !SERIES) return null;
  if(COUNT){                                     // round 2: from the crossing frame of each moment
    for(const m of TL.moments){ const u=(fr-m.frame)/FPS; if(u>=0 && u<CALLOUT.sec) return {rec:m, u}; }
    return null;
  }
  for(const rec of TL.records){
    const s0=TL.startFrame[rec.k], u=(fr-s0)/FPS;
    if(u>=0 && u<CALLOUT.sec) return {rec,u};
  }
  return null;
}
function drawCallout(CO,cur){
  window.__CALLOUT=null;
  const C=CALLOUT||{y:116,size:30};
  if(CO){
    const a=Math.min(1,CO.u/C.fade_in)*Math.min(1,(C.sec-CO.u)/C.fade_out);
    ctx.globalAlpha=Math.max(0,a);
    const sz=C.size, cw=sz*1.15, ch=sz*0.9, R=CO.rec, type=(R.type||'crown').toLowerCase();
    let x=LEFT;
    if(type==='crown'){ drawCrown(LEFT,C.y-ch*0.92,cw,ch,CROWN?CROWN.colour:'#F5C542'); x+=cw+12; }
    ctx.fillStyle=T.ink; ctx.font='600 '+sz+'px '+FONT;
    const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||'th');
    const main = type==='crown' ? ENT[R.id].label+' becomes the best-selling console ever'
               : type==='first_past' ? ENT[R.id].label+' is the first console past '+(R.units/1e6).toLocaleString('en-GB')+' million'
               : ENT[R.id].label+' passes '+ENT[R.other].label+' for '+(R.rank===2?'second':ord(R.rank))+' place';
    text('callout',R.id,main,x,C.y,'left'); x+=ctx.measureText(main).width;
    const extra=(type==='crown' ? ' · passes '+ENT[R.previous||R.other].label : '')+(R.style!=='official'?' · estimated figures':'');
    ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+sz+'px '+FONT;
    text('callout_extra',CO.rec.id,extra,x,C.y,'left');
    window.__CALLOUT={id:R.id, previous:R.previous||R.other, type, k:R.k, frame:R.frame, alpha:ctx.globalAlpha};
    ctx.globalAlpha=1;
    return;
  }
  if(FINAL_ON){                                  // round 2: the final-table line and footnote
    window.__FINAL={};
    if(TL.finalLine){ ctx.fillStyle=T.ink; ctx.font='600 '+C.size+'px '+FONT; tabText(TL.finalLine.text, LEFT, C.y, 'left', 'final_line', null); window.__FINAL.line=TL.finalLine.text; }
    if(FFOOT){ ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+FFOOT.size+'px '+FONT; tabText(FFOOT.mark+' '+FFOOT.text, LEFT, C.y+FFOOT.dy, 'left', 'footnote', FFOOT.id); window.__FINAL.footnote=FFOOT.text; }
  }
  if(NOTES){                                     // the PS2 note candidate (DEC-094), stills only
    for(const n of NOTES) if(cur.order.slice(0,NROWS).includes(n.id)){
      ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+(CFG.note_size||28)+'px '+FONT;
      tabText(n.mark+' '+n.text, LEFT, C.y, 'left', 'note', n.id);
    }
  }
}
/* The maker key (DEC-085): each maker that has launched a console by this quarter end, in maker_order
   (or, with scoreboard, by total): colour, logo on a light tile (to identify the maker only), name,
   and with scoreboard its total ("891.3m"), marked like the bars when it contains estimated or
   analyst figures. A legend for the two estimated looks and the crown sits under the list. The panel's
   size is fixed (room for every maker), so nothing moves when a maker joins. */
function drawMakerKey(cur, SF){
  window.__KEY=null;
  if(!MKEY) return;
  const M=MKEY, n=MAKERS.length, legendH=M.legend ? 2*(M.size+12) : 0, H=M.pad*2+n*M.row_h+legendH, y0=M.bottom-H;
  ctx.globalAlpha=1; ctx.fillStyle=T.panel; rr(M.x,y0,M.w,H,10); ctx.fill();
  const TOT = SF ? SF.mu : cur.maker_totals, PLS = SF ? SF.mplus : cur.maker_plus;   // round 2: counted totals
  let ms=MAKERS.filter(m=>TOT[m]!=null);
  if(M.scoreboard) ms=ms.slice().sort((a,b)=>(TOT[b]-TOT[a]) || (MAKERS.indexOf(a)-MAKERS.indexOf(b)));
  const rowsOut=[];
  ms.forEach((m,i)=>{
    const cy=y0+M.pad+i*M.row_h+M.row_h/2, colour=darkenForWhite(CFG.palette[MAKERS.indexOf(m)]);
    const st=M.scoreboard ? cur.maker_style[m] : 'official';
    drawStyledBar(M.x+M.pad, cy-13, 26, 26, colour, st);
    const lx=M.x+M.pad+26+12, ly=cy-M.logo_h/2;
    ctx.fillStyle='#F4F6FA'; rr(lx,ly,M.logo_w,M.logo_h,6); ctx.fill();
    const im=LOGOIMG[m];
    if(im && im.naturalWidth){ const pw=M.logo_w-12, ph=M.logo_h-8, sc=Math.min(pw/im.naturalWidth, ph/im.naturalHeight);
      ctx.drawImage(im, lx+(M.logo_w-im.naturalWidth*sc)/2, ly+(M.logo_h-im.naturalHeight*sc)/2, im.naturalWidth*sc, im.naturalHeight*sc); }
    ctx.fillStyle=T.ink; ctx.font='600 '+M.size+'px '+FONT;
    text('key_name',m,MAKERNAME[m],lx+M.logo_w+14,cy+M.size*0.35,'left');
    const row={key:m, y:cy, style:st};
    if(M.scoreboard){
      ctx.font='700 '+M.size+'px '+FONT;
      const t=millions(TOT[m])+(PLS[m]?'+':''), rx=M.x+M.w-M.pad;
      const tw=tabText(t,rx,cy+M.size*0.35,'right','key_total',m);
      row.total=TOT[m]; row.plus=!!PLS[m];
      if(st!=='official'){
        ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+M.size+'px '+FONT;
        text('key_est',m,st==='analyst_estimate'?'analyst est.':'estimated',rx-tw-12,cy+M.size*0.35,'right');
      }
    }
    rowsOut.push(row);
  });
  if(M.legend){
    const ly1=y0+M.pad+n*M.row_h+M.size*0.9, ly2=ly1+M.size+12, sw='#8492A6';
    let x=M.x+M.pad;
    ctx.font='500 '+M.size+'px '+FONT;
    drawStyledBar(x,ly1-M.size*0.8,26,M.size*0.95,sw,'estimated'); x+=36;
    ctx.fillStyle=T.cap||T.muted; text('key_legend','estimated','estimated',x,ly1,'left'); x+=ctx.measureText('estimated').width+30;
    drawStyledBar(x,ly1-M.size*0.8,26,M.size*0.95,sw,'analyst_estimate'); x+=36;
    ctx.fillStyle=T.cap||T.muted; text('key_legend','analyst','analyst estimate',x,ly1,'left');
    x=M.x+M.pad;
    drawCrown(x,ly2-M.size*0.78,M.size*1.15,M.size*0.85,CROWN?CROWN.colour:'#F5C542'); x+=M.size*1.15+10;
    ctx.fillStyle=T.cap||T.muted; text('key_legend','crown','best-selling console ever',x,ly2,'left');
  }
  window.__KEY={box:{x:M.x,y:y0,w:M.w,h:H}, rows:rowsOut};
}

/* ---- one race frame. t is seconds into the race; the frame index is what matters ---- */
function drawAt(t){
  baseTransform(); window.__LABELS=[]; window.__GRID=[];
  const f=Math.round(t*FPS);
  const outroF=Math.max(0,f-RACE_FRAMES);
  const fr=Math.min(f,RACE_FRAMES);
  const k=RTT_TIMELINE.eventAt(TL,fr);
  const cur = k>=0 ? TL.states[k] : TL.opening;
  const prev= k>0 ? TL.states[k-1] : TL.opening;
  const ev  = k>=0 ? TL.events[k] : (TL.openingEvent || {season:TL.events[0].season});
  window.__EVENT = k>=0 ? {k, race_index:ev.race_index} : {k:-1, race_index: TL.openingEvent?TL.openingEvent.race_index:null};
  window.__RANK = cur.order.slice(0,NROWS);

  /* (b) the count steps at the event; only the bar's length moves, over glide.bar_sec */
  const since = k>=0 ? fr-TL.startFrame[k] : 0;
  /* IQ-10 glide.bar_mode "beat": straight line over the whole quarter (the last one: glide.bar_sec) */
  const beatF = GLIDE_BEAT && k>=0 ? (k+1<TL.startFrame.length ? TL.startFrame[k+1]-TL.startFrame[k] : CFG.glide.bar_sec*FPS) : 0;
  const g = k>=0 ? (GLIDE_BEAT ? Math.min(1, since/Math.max(1,beatF)) : ease(since/Math.max(1,CFG.glide.bar_sec*FPS))) : 1;
  /* IQ-10 round 2 (count): the counted board - values, bar lengths, order and "+" from seriesFrame */
  const SF = COUNT ? RTT_TIMELINE.seriesFrame(TL, k, since) : null;
  const ORD = SF ? SF.order : cur.order;
  if(SF) window.__RANK = ORD.slice(0,NROWS);
  const rows = SF ? ORD.map(id=>({c:ENT[id], n:SF.u[id], s:null, len:SF.u[id], st:cur.style[id], pl:SF.plus[id]}))
                  : cur.order.map(id=>({c:ENT[id], n:cur.totals[id], s:cur.starts?cur.starts[id]:null, len:lerp(prev.totals[id]||0, cur.totals[id], g),
                                   st:SERIES?cur.style[id]:null, pl:SERIES?!!cur.plus[id]:false}));
  const top = rows.slice(0,NROWS+3);

  ctx.fillStyle=T.ground; ctx.fillRect(0,0,1920,1080);
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle=T.ink; ctx.font='700 50px '+FONT;
  let titleTxt=CFG.title;
  if(CFG.time_label.mode==='title') titleTxt+=' · '+ev.season+(ev.grand_prix?' · '+ev.grand_prix:'');
  text('title',null,titleTxt,LEFT,74,'left');
  const tsec=fr/FPS, CO=calloutAt(fr);
  FINAL_ON = COUNT && !CO && TL.isDataEnd && k===TL.events.length-1 && fr>=TL.finalFrom && !!(TL.finalLine||FFOOT);
  const subA=CO ? 0 : Math.max(0,Math.min(1,(CFG.subtitle_sec||0)-tsec));
  if(subA>0){
    ctx.globalAlpha=subA; ctx.fillStyle=T.muted; ctx.font='500 22px '+FONT;
    text('subtitle',null,CFG.subtitle,LEFT,106,'left');
    ctx.globalAlpha=1;
  }

  // the time label sits UNDER the bars, as C2-2's year did, so a long bar crosses in front
  drawTime(ev);

  // scale: follows the longest bar as drawn, so it glides with the bars
  const G=geom(), x0=G.x0, W=G.W;
  const lead=top.slice(0,NROWS).reduce((m,r)=>Math.max(m,r.len),0);
  const smoothMax=Math.max(1,lead)*1.06;
  const step=niceStepInt(smoothMax/AXU/4)*AXU;            // IQ-10: whole millions in a series (AXU 1e6); AXU 1 for RTT-002
  ctx.font='400 '+SZ.axis+'px '+FONT;
  for(let v=0;v<=smoothMax+1e-9;v+=step){
    const x=x0+W*v/smoothMax; if(x>1920-RIGHT-VALW+20) break;
    const av=Math.round(v/AXU);
    ctx.fillStyle=T.axis; tabText(av.toLocaleString('en-GB')+(SERIES&&av>0?(CFG.axis_suffix||''):''),x,TOP-6,'center','axis',null);
    ctx.fillStyle=T.grid; gridLine(Math.round(x),TOP+8,BOTTOM);
  }

  const ROWH=G.ROWH, BARH=G.BARH, VALF=G.VALF;
  const K=1-Math.exp(-1/(CFG.glide.rank_sec*FPS));
  /* A row joining the board (target inside it, row still below the last slot) starts just
     under the last row rather than from wherever it was waiting, and glides in with the
     shorter glide.entry_sec, so it is clearly visible within a few frames of its race. Every
     other move keeps C2-2's rank glide. */
  const KE=CFG.glide.entry_sec ? 1-Math.exp(-1/(CFG.glide.entry_sec*FPS)) : K;
  rows.forEach((r,i)=>{const c=r.c,tgt=Math.min(i,NROWS+2); if(c._y==null)c._y=tgt;
    const entering = tgt<=NROWS-1 && c._y>NROWS-1;
    if(entering && CFG.glide.entry_sec) c._y=Math.min(c._y,NROWS);
    c._y+=(tgt-c._y)*(entering?KE:K);});

  const nf=nameSize();
  /* IQ-05b winner highlight: 1 on the first frame of the race, fading to 0 over HL.sec (eased);
     held at 1 through a winning streak so a repeat winner never flickers. */
  const hlOf={};
  if(HL && k>=0) for(const h of TL.highlight[k])
    hlOf[h.id] = h.streak ? 1 : 1-ease(since/Math.max(1,HL.sec*FPS));
  /* IQ-05c event label: the race's winners on the board carry "· <GP>" after their value from the
     first frame of the race; the previous race's label stays until this race lands and then fades
     over EVL.fade_sec (a driver who wins again simply shows the new Grand Prix). */
  const evOf={};
  if(EVL && k>=0){
    const cur=TL.highlight[k].map(h=>h.id), fadeF=Math.max(1,EVL.fade_sec*FPS);
    if(k>0 && since<fadeF) for(const h of TL.highlight[k-1]) if(!cur.includes(h.id))
      evOf[h.id]={text:eventText(TL.events[k-1]), a:1-ease(since/fadeF), race_index:TL.events[k-1].race_index};
    for(const id of cur) evOf[id]={text:eventText(ev), a:1, race_index:ev.race_index};
  }
  window.__BARS=[]; window.__FLAGS=[]; window.__PICS=[]; window.__CROWN=null; window.__LOGOS=[];
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOP, 1920, BOTTOM-TOP); ctx.clip();
  top.forEach(r=>{
    const c=r.c, y=TOP+14+c._y*ROWH; if(y>BOTTOM-4) return;
    ctx.globalAlpha=c._y>NROWS-1?Math.max(0,1-(c._y-(NROWS-1))/0.75):1;
    const hl=hlOf[c.id]||0;
    const w=Math.max(3,W*r.len/smoothMax), colour=darkenForWhite(c.colour);
    const by=y+(ROWH-BARH)/2, mid=by+BARH/2;
    /* IQ-10 fade: fa scales the bar and picture, ta the text */
    const RA=ctx.globalAlpha, fa=fadeOf(c.id,k,fr), ta=FADE ? 1-(1-FADE.text_alpha)*(1-fa)/(1-FADE.alpha) : 1;
    window.__BARS.push({id:c.id, y:c._y, alpha:ctx.globalAlpha, colour, hl, rect:{x:x0,y:by,w,h:BARH}, style:r.st, fade:fa, plus:r.pl, units:r.n});
    if(ctx.globalAlpha<=0){ ctx.globalAlpha=1; return; }
    if(PIC){                                     // IQ-10 picture, in the column left of the bar
      const im=PICIMG[c.id], bx=LEFT, byy=mid-G.PH/2;
      if(im && im.naturalWidth){
        /* round 2: a portrait picture may be up to PIC.tall_frac of the box height (the tall consoles) */
        const tall = im.naturalWidth<im.naturalHeight && PIC.tall_frac ? PIC.tall_frac : 1, bh=G.PH*tall, bY=mid-bh/2;
        const sc=Math.min(G.PW/im.naturalWidth, bh/im.naturalHeight), iw=im.naturalWidth*sc, ih=im.naturalHeight*sc;
        const d={x:bx+(G.PW-iw)/2, y:bY+(bh-ih)/2, w:iw, h:ih};
        ctx.globalAlpha=RA*fa; ctx.drawImage(im,d.x,d.y,d.w,d.h); ctx.globalAlpha=RA;
        window.__PICS.push({id:c.id, box:{x:bx,y:bY,w:G.PW,h:bh}, drawn:d, alpha:RA*fa, tall:tall>1});
      }
    }
    if(BLOGO){                                   // round 2: the maker's logo on a light tile beside the picture
      const lx=LEFT+G.PW+BLOGO.gap, ly=mid-G.LH/2, lim=LOGOIMG[c.maker];
      ctx.globalAlpha=RA*fa; ctx.fillStyle='#F4F6FA'; rr(lx,ly,G.LW,G.LH,5); ctx.fill();
      let d=null;
      if(lim && lim.naturalWidth){ const pw=G.LW-2*BLOGO.pad, ph=G.LH-2*BLOGO.pad, sc=Math.min(pw/lim.naturalWidth, ph/lim.naturalHeight);
        d={x:lx+(G.LW-lim.naturalWidth*sc)/2, y:ly+(G.LH-lim.naturalHeight*sc)/2, w:lim.naturalWidth*sc, h:lim.naturalHeight*sc};
        ctx.drawImage(lim,d.x,d.y,d.w,d.h); }
      ctx.globalAlpha=RA;
      window.__LOGOS.push({id:c.id, maker:c.maker, tile:{x:lx,y:ly,w:G.LW,h:G.LH}, drawn:d, alpha:RA*fa});
    }
    if(SERIES) ctx.globalAlpha=RA*fa;
    /* IQ-05c flag, in the column left of the bar, same row, same opacity */
    const code=FLAGS && FLAGCODE[c.id];
    if(code && FLAGIMG[code]){
      const fy=mid-G.FH/2;
      ctx.save(); rr(LEFT,fy,G.FW,G.FH,3); ctx.clip(); ctx.drawImage(FLAGIMG[code],LEFT,fy,G.FW,G.FH); ctx.restore();
      ctx.save(); ctx.strokeStyle='rgba(244,246,250,0.35)'; ctx.lineWidth=1; rr(LEFT+0.5,fy+0.5,G.FW-1,G.FH-1,3); ctx.stroke(); ctx.restore();
      window.__FLAGS.push({id:c.id, code, x:LEFT, y:fy, w:G.FW, h:G.FH, alpha:ctx.globalAlpha});
    }
    if(hl>0){
      ctx.save(); ctx.shadowColor=mixWhite(colour,0.5); ctx.shadowBlur=HL.glow*hl*RASTER;
      ctx.fillStyle=mixWhite(colour,HL.mix*hl); rr(x0,by,w,BARH,2); ctx.fill(); ctx.restore();
    } else if(SERIES){ drawStyledBar(x0,by,w,BARH,colour,r.st); }
    else { ctx.fillStyle=colour; rr(x0,by,w,BARH,2); ctx.fill(); }
    if(SERIES) ctx.globalAlpha=RA*ta;

    ctx.font='600 '+nf+'px '+FONT;
    const nx=x0+18;
    const nm=fitName(c.label, 1920-64-nx-18-160);
    let nameOut=0;
    /* the pad under a name mid-overtake (C2-2's, applied to on-bar names too) */
    if(top.some(o=>o.c!==c && Math.abs(o.c._y-c._y)<0.85)){
      const pw=ctx.measureText(nm).width;
      if(nx+pw>x0+w){ ctx.fillStyle=T.ground; ctx.fillRect(x0+w, mid-nf*0.78, nx+pw-(x0+w)+6, nf*1.5); }
    }
    ctx.fillStyle='#F4F6FA';
    if(NAMEOVERFLOW){
      text('name',c.id,nm,nx,mid+nf*0.35,'left');
      nameOut=Math.max(0,(nx+ctx.measureText(nm).width)-(x0+w));
    } else if(nx+ctx.measureText(nm).width+14<x0+w){ text('name',c.id,nm,nx,mid+nf*0.35,'left'); }
    else { ctx.fillStyle=T.ink; text('name',c.id,nm,x0+w+18,mid+nf*0.35,'left'); nameOut=ctx.measureText(nm).width+30; }

    ctx.font=(STATS?'700 ':'600 ')+VALF+'px '+FONT;          // IQ-05e: the win count in bold
    const txt=SERIES ? fmtS(r.n,r.pl,c.id)+(FINAL_ON&&FFOOT&&FFOOT.id===c.id?FFOOT.mark:'') : fmt(r.n), tw=tabWidth(txt,pitch());
    let after;                                   // where anything after the value may start
    if(!VALOUT && !nameOut && w>tw+40+ctx.measureText(nm).width+24){ ctx.fillStyle='#F4F6FA'; tabText(txt,x0+w-18,mid+VALF*0.35,'right','value',c.id); after=x0+w+18; }
    else { ctx.fillStyle=T.ink; tabText(txt,x0+w+18+nameOut,mid+VALF*0.35,'left','value',c.id); after=x0+w+18+nameOut+tw+VALF*0.35; }
    const el=evOf[c.id];
    if(el && el.a>0){
      const a0=ctx.globalAlpha; ctx.globalAlpha=a0*el.a;
      ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+VALF+'px '+FONT;
      tabText('· '+el.text,after,mid+VALF*0.35,'left','event',c.id);   // IQ-05d: the date's digits on fixed pitch too
      window.__LABELS[window.__LABELS.length-1].race_index=el.race_index;
      ctx.globalAlpha=a0;
    }
    if(STATS){                                   // IQ-05e: "· 306 starts · 29.7%" on every bar
      ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+VALF+'px '+FONT;
      tabText(statsText(r.n,r.s),after,mid+VALF*0.35,'left','stats',c.id);
    }
    if(SERIES && r.st==='analyst_estimate'){     // IQ-10 (DEC-084): the analyst-estimate label
      ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+VALF+'px '+FONT;
      after+=tabText('· analyst estimate',after,mid+VALF*0.35,'left','est_label',c.id)+VALF*0.35;
    }
    if(CROWN && SERIES && c.id===ORD[0]){ // IQ-10: the crown after the leader's value
      const ch=VALF*1.0, cw=ch*1.3, cx=after+2, cy=mid-ch*0.55;
      drawCrown(cx,cy,cw,ch,CROWN.colour);
      window.__CROWN={id:c.id, x:cx, y:cy, w:cw, h:ch, alpha:ctx.globalAlpha};
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();

  ctx.fillStyle=T.foot; ctx.font='400 '+SZ.footer+'px '+FONT;
  text('footer',null,CFG.footer||'',LEFT,1080-20,'left');

  if(SERIES){ drawCallout(CO, cur); drawMakerKey(cur, SF); }   // IQ-10

  /* IQ-05c overlays (DEC-035): each picture fitted inside its reserved box; none if absent */
  window.__OVERLAYS=OVL.map(b=>{
    let drawn=null;
    if(b.img){
      const s=Math.min(b.w/b.img.naturalWidth, b.h/b.img.naturalHeight), w=b.img.naturalWidth*s, h=b.img.naturalHeight*s;
      drawn={x:b.x+(b.w-w)/2, y:b.y+(b.h-h)/2, w, h};
      ctx.drawImage(b.img, drawn.x, drawn.y, w, h);
    }
    return {name:b.name, box:{x:b.x,y:b.y,w:b.w,h:b.h}, drawn};
  });

  if(outroF>0 && CFG.outro_sec>0) drawOutro(outroF/FPS);   // outro_sec 0 = no closing card (pilots)
}
window.drawAt=drawAt;

function drawOutro(o){
  const a=Math.min(1, o/1.2);
  const BAND=1080-268;
  ctx.globalAlpha=a;
  let g=ctx.createLinearGradient(0,BAND-170,0,BAND-30);
  g.addColorStop(0,'rgba(6,10,18,0)'); g.addColorStop(1,'rgba(6,10,18,0.97)');
  ctx.fillStyle=g; ctx.fillRect(0,BAND-170,1920,140);
  ctx.fillStyle='rgba(6,10,18,0.97)'; ctx.fillRect(0,BAND-30,1920,1080-BAND+30);
  ctx.fillStyle=T.ink;   ctx.font='700 54px '+FONT;
  text('outro_q',null,CFG.outro_q||'',960,BAND+18,'center');
  ctx.fillStyle=T.cap||T.muted; ctx.font='500 34px '+FONT;
  text('outro_sub',null,CFG.outro_sub||'',960,BAND+68,'center');
  ctx.fillStyle=T.rule||T.accent; ctx.fillRect(0,BAND+104,1920,2);
  ctx.fillStyle=T.ink;  ctx.font='700 68px '+FONT;
  text('outro_cta',null,CFG.outro_cta||'',LEFT,BAND+186,'left');
  ctx.fillStyle=T.muted; ctx.font='400 28px '+FONT;
  text('outro_more',null,CFG.outro_more||'',LEFT,BAND+228,'left');
  ctx.globalAlpha=1;
}
</script>
