<!-- ===========================================================================
     Race Through Time - the RTT player.  Format RTT-1, IQ-04, 28 Sep 2026.

     COPIED from Market Marathon's player_formatc2.html (Format C2-2), as shipped in
     MarketMarathon_RaceKit_RF_US_C2_v3.zip, marketmarathon/bars @ 2a10877
     (sha256 39e32a54...64b7 in that kit's dataset_hashes.txt). The C2-2 file itself is
     never edited for RTT (DEC-002); this is a separate copy.

     Kept from C2-2: the 1920x1080 drawing space scaled by RASTER; the navy look and its
     three neutral levels; Archivo; the board geometry (bars end at x 1150, names on the bars
     and allowed to overflow, the value past whichever is longer, one name size for the whole
     video); darkenForWhite(); tabular digits; the eased rank glide (0.55 s) with the fading
     eleventh row; the name pad during overtakes; the intro and closing card beats.

     Changed for RTT (prompts/CODE_SESSION_IQ-04.md step 3):
       a. value labels are whole numbers with a unit word ("106 wins", "1 win"). No bn/tn,
          no currency symbol, no decimals, no USD bracket. The axis steps by whole numbers.
       b. a count STEPS at its event and never shows an in-between value. Only the bar's
          LENGTH glides (glide.bar_sec) and its row glides (glide.rank_sec).
       c. no country flags, no sub-sector icons, no merger lineage/rename rows, no year
          plates. Colours come from the config palette, one per driver, in data order.
       d. the time label is season + Grand Prix + date, drawn bottom-right of the board,
          and the event timing comes from rtt_timeline.js (adaptive pacing, 0.8-1.4x).
       e. ties: equal counts rank by who reached that count first (rtt_timeline.js).
       f. every RTT word, colour and number comes from config.json through setup().

     Changed in IQ-05 (DEC-022 to DEC-025):
       - colours: one per driver for the whole dataset, from rtt_timeline.js assignColours()
         (no two drivers who can be on screen together share a colour or get similar ones);
         darkenForWhite() now lives there as drawnColour(), unchanged.
       - sizes: the axis numbers, date and footer take their px from config "sizes" (C2-2's
         20 / 28 / 17 when the key is absent), enlarged for RTT so they read on a phone.
       - entering rows: a driver joining the board starts its slide just under the last row and
         glides in with glide.entry_sec, so it is clearly visible within 8 frames of its race.
     Changed in IQ-05 round 2 (DEC-027 to DEC-033), all switched by config, so config.json draws
     exactly as before:
       - board: "board" {bar_gap, name_frac, value_frac} sets the gap between bars and how much
         of a bar the name and value text may fill (C2-2's 22 px / 0.56 / 0.54 when absent), so a
         20-row board can keep its text as large as the rows allow.
       - winner highlight: "highlight" {enabled, sec, mix, glow}. On the first frame of a race each
         credited winner whose bar is on the board is brightened towards white and given a soft
         glow, fading out over highlight.sec. A driver who also wins the next race stays lit
         through the streak rather than fading and re-lighting (no flicker).
       - winner line: "winner_line" {enabled} adds "Won by <driver> · <n> wins" under the date
         (every credited driver on a shared drive), and lifts the time label to make room.
     Changed in IQ-05 round 3 (DEC-034 to DEC-044), all switched by config, so config.json draws
     exactly as before:
       - flags: "flags" {enabled, column, height_frac, gap, csv}. Each driver's nationality flag
         (data/rtt-002/driver_nationality.csv; flag-icons SVGs loaded by rtt.js, never committed)
         in a narrow column just left of the bars, moving with its row. column true keeps the
         column's space even while enabled is false, so the layout does not change when the
         flags are switched on. A driver without a flag file gets none; the name is always drawn.
       - event label: "event_label" {enabled, fade_sec}. A winner on the board gets
         "· <Grand Prix>" (GP short form, rtt_timeline.js gpShort) after its value from the first
         frame of the race; it stays until the next race lands, then fades over fade_sec.
       - time block: time_label.mode "block" {x, date_y, align} draws the season, Grand Prix and
         date at a fixed place next to the board instead of the bottom-right corner.
       - overlays (DEC-035): "overlays" [{name, file, x, y, w, h}] reserves a box per picture (Luke's
         logo top right, a generic car bottom right). rtt.js loads each file from the git-ignored
         kits/rtt-002/local_assets/ if it is there; the picture is drawn fitted inside its box
         (aspect kept, centred). A missing file draws nothing and the render goes on. The box is
         reserved either way, and the tests check nothing else ever enters it.
     Changed in IQ-05 round 4 (DEC-045 to DEC-050), all switched by config, so config.json draws
     exactly as before:
       - date line: time_label.mode "line" {x, y, align, size} replaces the season / Grand Prix /
         date block with ONE small line, "25 October 2020 · Portuguese GP", next to the title. It
         names the race on screen on every frame, including races won by a driver off the board.
       - event label date: event_label.date true adds the race date after the Grand Prix
         ("92 wins · Portuguese GP · 25 October 2020"), in the same "D Month YYYY" form.
       - overlays: the axis grid lines stop short of every reserved overlay box (with the gap
         overlay_gap), so nothing at all is drawn inside a box except its picture. Grid segments are
         recorded in window.__GRID for the tests.
     Changed in IQ-05 round 5 (DEC-053), switched by config, so config.json draws exactly as before:
       - stats label: "stats_label" {enabled} puts wins, starts and win rate after EVERY bar on the
         board: "91 wins · 306 starts · 29.7%" ("1 win", "1 start"). The win count ("91 wins", the
         value label) is bold; "· 306 starts · 29.7%" follows in the caption grey. Starts come from
         the race file (adapter 1.1, events[].starts); the rate is rtt_timeline.js rateText (one
         decimal, rounded half up). All three numbers step only at a race, like the wins. It
         replaces the event label (the player refuses the two together); the date line still names
         every race. Recorded in window.__LABELS as kind "stats".
     Changed in IQ-10 (RTT-003 design pilot, DEC-085 and DEC-103 onwards), only for a quarter-end series
     ("rtt-series/1", scripts/rtt003_adapter.py) or behind new config keys, so every RTT-002 config draws
     exactly as before (checked frame by frame against main):
       - values: millions with one decimal, rounded half up from whole units ("118.7m"), "+" where the
         data flags a lower bound; the axis steps in whole millions (axis_suffix "m").
       - pictures: "pictures" {enabled, height_frac, aspect, gap}: one console picture per bar in a column
         left of the bars (private icons, loaded by rtt.js; never committed), fitted inside its box.
       - maker colours: one colour per maker (rtt_timeline.js buildSeries, maker_order -> palette).
       - estimated look (DEC-090, DEC-084): display_style "estimated" bars carry dark diagonal stripes;
         "analyst_estimate" bars are drawn half-strength with a dashed outline and "· analyst estimate"
         after the value.
       - fade: "fade" {enabled, alpha, text_alpha, sec}: from its fade quarter end a retired console's
         bar and picture fade to alpha, its text to text_alpha (DEC-086, DEC-093).
       - crown: "crown" {enabled, colour}: a crown after the leader's value.
       - callout: "callout" {enabled, sec, y, size}: at each change of first place, one line under the
         title ("NES becomes the best-selling console ever ..."), for callout.sec.
       - maker key: "maker_key" {enabled, x, bottom, w, ...}: a panel with each maker's colour, logo and
         name, and a legend for the estimated look and the crown; scoreboard true adds each maker's total.
       - bar notes: "bar_notes" [{id, mark, text}]: a mark after that console's value and the note on the
         callout line (the PS2 note candidate, DEC-094; stills only).
       - glide.bar_mode "beat": a bar's length moves in a straight line over its whole quarter instead of
         easing over glide.bar_sec (values still step only at the quarter end).
     Changed in IQ-10 round 2 (Luke, DEC-114 onwards), series only:
       - count {enabled}: the numbers COUNT. Quarter k's bars and value labels move together on a straight
         line from quarter k-1's figures and land on the exact series.csv value on the quarter-end frame
         (rtt_timeline.js seriesFrame); the order, the crown and the scoreboard follow the counted figures,
         so an overtake shows on the frame where the numbers cross.
       - bar_logos {enabled, height_frac, aspect, gap, pad}: the maker's logo on a light tile right beside
         each console picture.
       - pictures.tall_frac: a portrait picture may use up to that much more height than the box, so the
         tall consoles do not look narrow (sizing only; no picture changed).
       - moments: callouts at every change of first place and at the configured extra moments, on the
         frame where the counted figures cross (rtt_timeline.js); final_line and final_footnote: one line
         and a small footnote under the title on the final table only (the footnote's mark after its
         console's value, final table only).
     Changed in IQ-10 round 3 (Luke, DEC-122 onwards), series with live_only only:
       - live board: only consoles still adding shipments race (rtt_timeline.js exit / isLive). During its
         retirement quarter a console's row shows "· retires"; right after that quarter it fades and leaves.
       - record line: a gold line across the chart at the all-time record (the most units of ANY console,
         retired included), labelled "Record: <console> <value>"; the crown sits on the holder's bar while it
         is on the board and moves to the label once it retires. The scale always includes the record.
       - final table: after the last count, a transition (final_transition_sec) to the ALL-TIME top table,
         retired consoles fading in with the faded look, the record line fading out, the date line reading
         "... · all-time top 15"; then the final line and footnote.
       - maker_in_name {enabled}: the maker's name after the console name ("Game Gear · Sega"), still only.
     Changed in IQ-10 round 4 (Luke, DEC-130 onwards), series with status only (live_only off):
       - status {enabled, retired, latest_figure, sec}: every console stays on the all-time board; a bar
         whose data status (series.csv `status`, rtt_timeline.js statusAt) is not live is dimmed with the
         fade alpha and carries "· retired" or "· latest figure" after its value, both fading in over sec
         from the quarter-end frame of the quarter where the status starts.
       - record_line {enabled}: the round-3 gold line without live_only - at the leader's figure, drawn after
         the bars and broken wherever a label crosses it, its label at its foot on the right.
     Changed in IQ-10 round 5 (Luke, DEC-138 onwards):
       - bar_logos.trim: the logo artwork is drawn trimmed to its own bounding box (logoCrop), so the tile
         shows the logo without the file's empty margins (series only; the scoreboard's logos are unchanged).
     Changed in IQ-13 (RTT-001 design pilot 1, DEC-169 onwards), only for a SHARE series (race kind "share",
     scripts/rtt001_adapter.py) or behind new config keys, so every RTT-002 and RTT-003 config draws exactly as before:
       - values: percent from whole hundredths, with values.decimals (1 or 2, rounded half up on the integers); with
         values.approx, an estimated (pre-2009) value reads "~85%" (whole percent, half up) or "<1%" (DEC-167 (B));
         the axis steps in whole percent (axis_suffix "%").
       - smoothing: done in rtt_timeline.js shareRace() at draw time (DEC-167); series.csv is never changed.
       - bars enter and leave: a browser that appears fades in at its value over its first month's count, one that
         stops fades out over the next month's count and is gone on that month end (rtt_timeline.js shareFrame).
       - date line: time_label.format "month" reads "June 1996".
       - source line: "source_line" {enabled, y, size, prefix, names, measure, estimated, changing}: one line under the
         title naming the month's source (series.csv source_line; inside a smoothed hand-over window "changing from X
         to Y"), with " · estimated" before 2009 (DEC-153).
       - new-source marker: "marker" {enabled, sec, text}: a small pill after the source line for marker.sec when a
         source line first names a new source (DEC-165 (8)).
       - dated notes: "notes_at" [{date, text}] with "note_line" {sec, size}: one calm line in the callout place
         for note_line.sec from that month (the June 1996 EWS note, DEC-165 (6)).
       - callout.texts {crown, passes, estimated}: callout wording templates ({id}, {other}, {rank}).
       - pictures.placeholder: an empty outlined picture box where there is no picture (logos not yet cleared).
       - pictures.files + pictures.tile (IQ-13b, DEC-180): one logo per browser from the listed private files, drawn
         unmodified and fitted on a light tile of the picture box's size; a browser with no usable logo has none.
       - pictures.crop {id: {x,y,w,h}} (IQ-13c): draw only that region of the file (the IE6 'e' without its wordmark;
         crop only, the file is unchanged); icons of 64 px or less are scaled without smoothing; pictures.own
         {id: {text, year}}: our own neutral tile (name and launch year on the bar colour) where no real logo exists.
       - board.stripes "screen" (DEC-212): the estimated look's stripes are anchored to the frame, not the bar, so a
         bar moving up or down does not carry a moving stripe pattern (flash safety); absent = as RTT-003 (unchanged).
       - board.fit {enabled, min_slots, sec} (IQ-13 answers, option for Luke, DEC-188/DEC-202): the rows are sized to
         the number of bars on the board (at least min_slots, at most rows) instead of always leaving room for ten;
         only row height and bar thickness change, smoothed over sec (fitSlots); window.__SLOTS records the slots.
     Changed in IQ-18 (RTT-103 design round 1, DEC-342 onwards), only for a MONEY series (race kind "money",
     scripts/rtt103_adapter.py) or behind new config keys, so every RTT-001, RTT-002 and RTT-003 config draws exactly as before:
       - values: whole US dollars -> "$169.0bn" (values.money {prefix, suffix, decimals 1|0, whole_from}; rounded half up
         on the integers); the axis steps in whole billions (AXU 1e9) with axis_prefix / axis_suffix.
       - dates: time_label.format "ttm" ("12 months to June 2026") or "quarter" ("Q2 2026"); date_block.label "ttm"
         ("12 months to June" over the year) or "quarter" ("Q2" over the year).
       - gaps {mode "leave"|"hold", alpha, text}: "leave" = the data (Alibaba leaves the board and returns); "hold" = the bar
         stays dimmed at its last length with no number and gaps.text instead (rtt_timeline.js holdGaps).
       - bar_tags [{id, text, mode "after"|"mark", mark, from, to}] and tag_foot {x, y, size, align}: a grey note after a
         company's value, or a mark after the value with the note in a footnote line (Tencent, DEC-292).
       - entry_tag {enabled, text, return_text, sec}: "· joins the race" after a late entrant's value for sec.
       - story {enabled, mode "line"|"card"|"marker", sec, items [{at, when, who, text, tag}]}: a dated story moment shown
         from the first frame of quarter `at` for sec - one line under the title, a small card, or a marker under the date.
       - combined {enabled, mode "number"|"line"|"bar", x, y, w, h, label}: the running total "Combined capital spending"
         (DEC-324), counted with the bars from the race file's `combined` (the data's sum of the bars).
     Changed in IQ-18b (RTT-103 round 2, Luke's answers DEC-353..DEC-365), money races only:
       - steps {enabled, sequence [{name explain|line|peaks|final, sec, dip_in, dip_out}], ...}: the steps
         after the race, scheduled by rtt_timeline.js (tl.stepPlan) and drawn by rtt_steps.js; a step can fade in from and
         out to the background (dip_in / dip_out seconds), and the race fades out over steps.race_dip_out before them;
         "final" redraws the race's last board with steps.final_line under the title.
       - story: an item with plain true is a plain line under the title on its own lane (Alibaba leaving and returning,
         DEC-355); cards (mode "card") queue among themselves; story.card.size "names" = the board's name size (DEC-357).
       - combined.gap_text: the panel's note during a gap ("{id}" = the company).
     Changed in IQ-18c (RTT-103 round 3, Luke's direction DEC-371), money races only; nothing changes without the keys:
       - forward {enabled, count_sec, boards [{year, kind plans|estimate, sec, month, source_line, footer, comb_note,
         notes{id}, prefix{id}}], extra{id: {label, colour, years, source, field}}}: the race carries on after its last
         quarter with one board per year (rtt_timeline.js forwardBoards): ranges (drawRangeExt), the board's notes after
         the values, a source line under the title, the board's footer, its date-block label, one scale for every forward
         board (fwdNeed), the total as a range; an extra row (ByteDance) is drawn in the "press" look and never counted.
         steps: "explain" (rtt_steps.js) replaces round 2's "plans" and "look"; "final" redraws the last REAL quarter.
       - board.fit.max_slots: more bars than `rows` may share the board (the text sizes stay those of `rows`).
       - story items: sec (a longer card), card_y (a card placed higher), sub (a line under the quote), tagColour; card
         labels wrap inside the card.
     Changed in IQ-19 (RTT-102 design round 1), only for a VISITS series (race kind "visits", scripts/rtt102_adapter.py),
     so every RTT-001, RTT-002, RTT-003 and RTT-103 config draws exactly as before (tests/player/compare_frames.js):
       - values: whole visits -> "~5.6bn" / "~950m" / "~84.1m" (values.visits {approx "all"|"between"|"none", bn_decimals 1|2};
         rounded half up on the integers; "between" = "~" only where the number on screen is not a published figure:
         on a month between two published months, or while counting); the axis reads "250m", "1bn", "1.5bn".
       - values.visits.older "stripes"|"none": Similarweb's older estimates (before its 28 Jul 2024 re-estimate) in the
         estimated look (frame-anchored stripes, board.stripes "screen") or plain; values.visits.look "analyst": every bar
         in the analyst-estimate look with values.visits.est_label after the value (an option for Luke).
       - names: the bar's name at that date (race events' labels: "Bard" until January 2024, then "Gemini").
       - pictures.switch {id: [{until, key}]}: a different logo file (pictures.files key) up to that date, crossfaded over
         the first month after it.
       - status (DEC-132) with status.sink: a bar after its last published month is held at that figure, ranked below the
         live bars, dimmed, "· latest figure"; "{month}" in status.latest_figure = its last published month ("Sep 2025").
       - story cards (RTT-103's, DEC-357) and final_line {text, y} (a fixed line on the final table) for visits too.
     Changed in IQ-19b (RTT-102 round 2, Luke's answers DEC-543..DEC-554 and Cowork's fixes DEC-555), visits only:
       - values.visits.between "sig2": a number that is not a published figure (a month on the line between two published
         months, or any frame while the bars count) shows two significant figures ("~80m", "~3.9bn"); published as before.
       - stripes: a bar counting from an older estimate to a current figure keeps the stripes until the current figure
         lands, so the stripes end exactly when the current figures begin.
       - notes_at[].to: the note stays until the landing frame of that month (the stripes' last frame).
       - combined (RTT-103's running total, DEC-359): the sum of the bars with a figure that month, counted with the bars
         (a bar arriving or leaving the sum is weighted by the count), its line, and its bottom line naming the bars
         left out after their latest figure (combined.drop_one / drop_many) or the number of sites (combined.count_text).
     Changed in IQ-21 (RTT-101 design round 1), only for a NET series (race kind "net", scripts/rtt101_adapter.py), drawn as a
     money race, so every RTT-001, RTT-002, RTT-003, RTT-102 and RTT-103 config draws exactly as before (compare_frames.js):
       - values: whole pence -> pounds (values.net {style "compact" "£1.71bn" / "£637m" / "£45.3m" | "m1" "£1,710.9m", ties
         "none" | "extra"}; rounded half up on the integers; "−£1.3m" below zero; ties "extra": while two neighbouring bars
         on the board show the same figure, both get one more decimal until they differ); the axis reads "£20m", "£1.5bn".
       - status.out: a club outside the Premier League keeps its frozen bar and rank (DEC-259), dimmed, with
         "· relegated {year}" (or any fixed text; "" = dimmed only); its return to the league brightens back over status.sec.
       - subline {enabled, text, y, size}: a fixed line under the title for the whole film ("Undisclosed fees not included").
       - date_block.freeze_label: the month line at the freeze point ("1 September" over 2026).
       - pictures.switch for net races too (the crest in use at each date); bar_edge {id: colour}: a club's second colour
         along the bottom of its bar (an option for kit colours).
       - combined.mode "avg": the leader's average net spend per PL season in 2026 pounds; combined.count_text, combined.dots.
       - steps "avgtable": a closing view after the final table, the final table's clubs ranked by that average.
     Removed as unused: the Format C / C2-1 picture column and story cards, the prototype
     driver block that followed </html> in the C2-2 file.

     Test hook: every text label drawn in a frame is recorded in window.__LABELS
     ({kind, id, text, x, y, w, size, alpha, tab, asc, desc, weight}; tab = drawn on fixed-pitch
     digits, asc/desc = the ink's height above and below the baseline, weight = font weight), each bar's row position,
     opacity, highlight and drawn rectangle in window.__BARS, each flag drawn in window.__FLAGS
     ({id, code, x, y, w, h, alpha}), each axis grid segment in window.__GRID ({x, y, w, h}) and
     the target order in window.__RANK. Drawing does not
     depend on them.
     =========================================================================== -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>

<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
/* Everything below draws in a 1920x1080 coordinate space. RASTER scales the real canvas up
   so a 4K master is the same drawing at twice the device pixels (C2-2 unchanged). */
let RASTER=1;
function setRaster(r){ RASTER=r||1; cv.width=1920*RASTER; cv.height=1080*RASTER; }
function baseTransform(){ ctx.setTransform(RASTER,0,0,RASTER,0,0); }

/* The C2-2 looks, byte-for-byte in their values. RTT defaults to navy (config "look"); a
   quieter variant can name another key or pass look_overrides in its own config. */
const LOOKS = {
  charcoal: { ground:'#0b0e14', panel:'#141922', ink:'#ffffff', muted:'#8d97a8', axis:'#69738a',
              accent:'#ffc933', hairline:'rgba(255,255,255,0.16)', grid:'rgba(255,255,255,0.05)', foot:'#5c657a' },
  navy:     { ground:'#0b1424', panel:'#152134', ink:'#F4F6FA', muted:'#8492A6', cap:'#AAB3C2',
              axis:'#8492A6', accent:'#F4F6FA', rule:'#2FD0C8',
              hairline:'rgba(244,246,250,0.14)', grid:'rgba(244,246,250,0.055)', foot:'#4A5563' },
  espresso: { ground:'#14100c', panel:'#1f1a14', ink:'#f6efe3', muted:'#a39682', axis:'#8b7f6d',
              accent:'#f0c987', hairline:'rgba(255,236,205,0.16)', grid:'rgba(255,236,205,0.05)', foot:'#7d7263' },
  slate:    { ground:'#101820', panel:'#19242e', ink:'#f4f8fa', muted:'#93a3b0', axis:'#72848f',
              accent:'#4fd1c5', hairline:'rgba(255,255,255,0.15)', grid:'rgba(255,255,255,0.05)', foot:'#647684' }
};

let FONT='"Archivo"';
let T=LOOKS.navy, CFG=null, TL=null, FPS=30;
let ENT={}, NROWS=10;
let LEFT=64, RIGHT=64, GAPBAR=12, VALW=260, BAREND=0, NAMESCALE=1, VALOUT=false, NAMEOVERFLOW=false;
let NAMEMODE='bar', YEARSIZE=112;
let RACE_SEC=0, RACE_FRAMES=0, INTRO_SEC=3.0;
let NAME_PX=null, NAME_TRUNC=false;
let SZ={axis:20, date:28, footer:17};
let BOARD={bar_gap:22, name_frac:0.56, value_frac:0.54}, HL=null, WINLINE=null;
let BOARDFIT=null;                             // IQ-13 answers: board.fit (rows sized to the bars on the board)
let FLAGCOL=null, FLAGS=false, FLAGIMG={}, FLAGCODE={}, EVL=null, OVL=[], OVLGAP=0, STATS=false;
/* IQ-10 (RTT-003): all null / false for RTT-002 */
let COUNT=false, BLOGO=null, FFOOT=null, FINAL_ON=false, LIVE=false, FINAL_LBL=false, STATUS=null, RECLINE=false;
let SERIES=false, PIC=null, PICIMG={}, LOGOIMG={}, MKEY=null, FADE=null, CROWN=null, CALLOUT=null, NOTES=null, GLIDE_BEAT=false, AXU=1, MAKERS=[], MAKERNAME={};
let SHARE=false, VAL=null, SRCL=null, MARK=null, NOTEL=null;
let STEPSON=false, FINALDRAW=false;   // IQ-18b (RTT-103): the steps after a money race
let FWD=null, FWDNEED={}, ROWCAP=10;   // IQ-18c (RTT-103): the race carries on through the 2026 plans and the 2027-2030 estimates
let VISITS=false, VISF=null, LASTM={};   // IQ-19 (RTT-102): all off for every other episode
let NET=false, NETF=null, NETX={}, SUBL=null, EDGE=null;   // IQ-21 (RTT-101): all off for every other episode
let MONEY=false, MONEYF=null, GAPS=null, TAGS=null, TAGFOOT=null, ENTRY=null, ENTRYK={}, STORY=null, COMB=null;   // IQ-18 (RTT-103): all off for RTT-001/002/003   // IQ-13 (RTT-001): all off for RTT-002 and RTT-003
let DATEBLK=null, ERA=null, ERAST=null, ERAIMG={};                          // RTT-001 date/era round (DEC-214..): off unless configured
let TOP=150; const BOTTOM=1080-46;            // IQ-10: TOP from config board_top (RTT-003); 150 for RTT-002

/* ---- the test hook: what text went on the frame ---- */

  let dropTxt=null;
  if(VISITS){ const out=Object.keys(cur.status||{}).filter(id=>cur.status[id]==='latest_figure');   // IQ-19b: bars left out after their latest figure
    if(out.length===1) dropTxt=(C.drop_one||'{id} not counted after {month}').replace('{id}',ENT[out[0]].short).replace('{month}',LASTM[out[0]]);
    else if(out.length>1) dropTxt=(C.drop_many||'{ids}: not counted after latest figures').replace('{ids}',out.map(id=>ENT[id].short).join(', ')); }
  const big = C.mode==='number' ? 72 : 52;
  ctx.fillStyle=T.ink; ctx.font='800 '+big+'px '+FONT; const tw=tabText(valTxt,C.x+pad,C.y+pad+30+big,'left','comb_value',null);

  const y0=C.y+pad+30+big+16;
  if(C.mode==='line' && TL.allCombined){
    const A=TL.allCombined, d0=+new Date(A[0].date), x0=C.x+pad, w=C.w-2*pad, h=C.y+C.h-NOTE_H-40-y0;
    const pts=A.filter(p=>p.date<=(k>=0?TL.events[k-1>=0?k-1:0].date:TL.openingEvent.date) || (k<0 && p.date<=TL.openingEvent.date));
    if(FWD && k>=0) for(const e of TL.events) if(e.fwd && e.date<=evP.date) pts.push({date:e.date, c:e.combined, lo:e.combined_lo});   // IQ-18c
    if(k>=0) pts.push({date:null, t:+new Date(evP.date)+(+new Date(evC.date)-(+new Date(evP.date)))*g, c:tot, lo:FC?totLo:undefined});
    const d1=Math.max(+new Date(A[A.length-1].date), FC ? pts[pts.length-1].t : 0);   // IQ-18c: the panel's years run on with the boards
    const X=p=>x0+w*(((p.t!=null?p.t:+new Date(p.date))-d0)/(d1-d0)), mx=Math.max(1,...pts.map(p=>p.c))*1.08, Y=p=>y0+h-h*p.c/mx;
    for(const gp of TL.gaps||[]) if(pts.length && (k<0?TL.openingEvent.date:evC.date)>=gp.from){ ctx.fillStyle='rgba(244,246,250,0.07)';
      const xa=X({date:gp.last}), xb=Math.min(X({date:gp.returns}), X(pts[pts.length-1])); if(xb>xa) ctx.fillRect(xa,y0,xb-xa,h); }
    ctx.strokeStyle=T.grid; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,y0+h); ctx.lineTo(x0+w,y0+h); ctx.stroke();
    const nA=FWD ? pts.filter(p=>p.lo==null).length : pts.length, PA=FWD && nA<pts.length ? pts.slice(0,nA) : pts;
    ctx.strokeStyle=T.rule; ctx.lineWidth=4; ctx.lineJoin='round'; ctx.beginPath(); PA.forEach((p,i)=>i?ctx.lineTo(X(p),Y(p)):ctx.moveTo(X(p),Y(p))); ctx.stroke();
    if(PA!==pts){                                   // IQ-18c: plans and estimates - dashed, with the range as a band
      const PF=pts.slice(nA-1), lo=p=>p.lo!=null?p.lo:p.c;
      ctx.save(); ctx.fillStyle=mixGround(T.rule,0.6); ctx.beginPath(); PF.forEach((p,i)=>i?ctx.lineTo(X(p),Y(p)):ctx.moveTo(X(p),Y(p)));
      PF.slice().reverse().forEach(p=>ctx.lineTo(X(p),Y({c:lo(p)}))); ctx.closePath(); ctx.fill();
      ctx.strokeStyle=T.rule; ctx.lineWidth=4; ctx.setLineDash([10,8]); ctx.beginPath(); PF.forEach((p,i)=>i?ctx.lineTo(X(p),Y(p)):ctx.moveTo(X(p),Y(p))); ctx.stroke(); ctx.restore(); }
    if(C.dots!==false) for(const [id,ks] of Object.entries(ENTRYK)) for(const kk of ks){ const p=A.find(q=>q.date===TL.events[kk].date); if(!p || kk>k) continue;
      ctx.fillStyle=darkenForWhite(ENT[id].colour); ctx.beginPath(); ctx.arc(X(p),Y({c:p.c}),6,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle=T.cap||T.muted; ctx.font='500 26px '+FONT; tabText(A[0].date.slice(0,4),x0,y0+h+30,'left','comb_axis',null); tabText(FC ? evC.date.slice(0,4) : A[A.length-1].date.slice(0,4),x0+w,y0+h+30,'right','comb_axis',null);
  } else if(C.mode==='bar'){
    const x0=C.x+pad, w=C.w-2*pad, bh=Math.min(40,C.y+C.h-NOTE_H-34-y0), max=C.scale_max||Math.max(...(TL.allCombined||[{c:tot}]).map(p=>p.c))*1.04;
    ctx.fillStyle='rgba(244,246,250,0.06)'; rr(x0,y0,w,bh,4); ctx.fill();
    let x=x0; const ids=(SF?SF.order:cur.order).filter(id=>!cur.held[id] && (id in cur.totals));
    for(const id of ids){ const sw=w*(SF?SF.u[id]:cur.totals[id])/max; ctx.fillStyle=darkenForWhite(ENT[id].colour); ctx.fillRect(x,y0,Math.max(0,sw-1),bh); x+=sw; }
    ctx.fillStyle=T.cap||T.muted; ctx.font='500 26px '+FONT; tabText('$0',x0,y0+bh+24,'left','comb_axis',null); tabText(money(Math.round(max/1e10)*1e10).replace('.0',''),x0+w,y0+bh+24,'right','comb_axis',null);
  }
  if(note){ ctx.fillStyle=T.ink; ctx.font='500 26px '+FONT; text('comb_note',null,note,C.x+pad,C.y+C.h-16,'left'); }
  else if(dropTxt){ ctx.fillStyle=T.cap||T.muted; ctx.font='500 26px '+FONT; text('comb_drop',null,dropTxt,C.x+pad,C.y+C.h-16,'left'); }   // IQ-19b
  else { ctx.fillStyle=T.cap||T.muted; ctx.font='500 26px '+FONT; text('comb_count',null,FC&&FC.comb_note ? FC.comb_note : VISITS ? (C.count_text||'sum of {n} sites').replace('{n}',nNow) : NET ? (C.count_text||'') : 'sum of '+nNow+' companies',C.x+pad,C.y+C.h-16,'left'); }
  ctx.restore();
  window.__COMBINED={value:tot, lo:FC?totLo:null, text:valTxt, exact:g>=1, companies:nNow, note:VISITS?dropTxt:note, box:{x:C.x,y:C.y,w:C.w,h:C.h}};
}

/* ---- IQ-21 (RTT-101) ---- */
/* the panel's option B: the leader's average net spend per PL season in 2026 pounds (series_onscreen.csv
   avg_real_net_per_season_gbp2026), for the month whose figures are on the board (the landed month; while the bars count,
   the month before) */
function drawAvgPanel(k, SF){
  const C=COMB, st=(SF&&SF.g>=1)||k<0 ? (k>=0?TL.states[k]:TL.opening) : (k>0?TL.states[k-1]:TL.opening), id=st.order[0], pad=20;
  ctx.save(); ctx.fillStyle=T.panel; rr(C.x,C.y,C.w,C.h,12); ctx.fill();
  ctx.fillStyle=T.cap||T.muted; ctx.font='600 26px '+FONT; text('comb_label',null,C.label,C.x+pad,C.y+pad+22,'left');
  if(C.label2) text('comb_label',null,C.label2,C.x+pad,C.y+pad+56,'left');
  const v=netText(st.avg[id],1);
  ctx.fillStyle=T.ink; ctx.font='800 64px '+FONT; tabText(v,C.x+pad,C.y+C.h-62,'left','comb_value',null);
  ctx.fillStyle=T.cap||T.muted; ctx.font='500 26px '+FONT;
  const n=st.seasons[id], line=ENT[id].short+' · '+n+' PL season'+(n===1?'':'s');
  text('comb_count',null,line,C.x+pad,C.y+C.h-18,'left');
  ctx.restore();
  window.__COMBINED={value:st.avg[id], text:v, leader:id, seasons:n, box:{x:C.x,y:C.y,w:C.w,h:C.h}};
}
/* the closing view (steps "avgtable"): the final table's clubs ranked by their average net spend per PL season in 2026
   pounds, at the freeze; ties keep the final table's order */
function drawAvgTable(u, S){
  baseTransform(); window.__LABELS=[]; window.__BARS=[]; window.__PICS=[];
  const last=TL.states[TL.states.length-1], n=S.rows||NROWS, ids=last.order.slice(0,n);
  const pos={}; ids.forEach((id,i)=>{ pos[id]=i; });
  const ord=ids.slice().sort((a,b)=>(last.avg[b]-last.avg[a])||(pos[a]-pos[b]));
  ctx.fillStyle=T.ground; ctx.fillRect(0,0,1920,1080); ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  ctx.fillStyle=T.ink; ctx.font='700 50px '+FONT; text('title',null,S.title||CFG.title,LEFT,74,'left');
  ctx.fillStyle=T.cap||T.muted; ctx.font='500 30px '+FONT; tabText(S.subtitle||'',LEFT,124,'left','subline',null);
  if(S.note){ ctx.font='500 26px '+FONT; tabText(S.note,LEFT,172,'left','avg_note',null); }
  const G=BOARDFIT?fitGeom(geom(),Math.max(BOARDFIT.min_slots,n)):geom(), nf=nameSize(), mx=Math.max(...ord.map(id=>last.avg[id]))*1.06;
  ord.forEach((id,i)=>{
    const c=ENT[id], y=TOP+14+i*G.ROWH, by=y+(G.ROWH-G.BARH)/2, mid=by+G.BARH/2, w=Math.max(3,G.W*last.avg[id]/mx);
    const im=PICIMG[id];
    if(PIC && im && PIC.tile){ const pad=PIC.tile_pad!=null?PIC.tile_pad:6, byy=mid-G.PH/2; ctx.fillStyle='#F4F6FA'; rr(LEFT,byy,G.PW,G.PH,8); ctx.fill();
      const iw=im.naturalWidth||1, ih=im.naturalHeight||1, sc=Math.min((G.PW-2*pad)/iw,(G.PH-2*pad)/ih); ctx.drawImage(im,LEFT+(G.PW-iw*sc)/2,byy+(G.PH-ih*sc)/2,iw*sc,ih*sc);
      window.__PICS.push({id, box:{x:LEFT,y:byy,w:G.PW,h:G.PH}, alpha:1, tile:true}); }
    drawStyledBar(G.x0,by,w,G.BARH,darkenForWhite(c.colour),'official');
    if(EDGE && EDGE[id]){ const eh=Math.max(4,Math.round(G.BARH*0.18)); ctx.save(); rr(G.x0,by,w,G.BARH,2); ctx.clip(); ctx.fillStyle=EDGE[id]; ctx.fillRect(G.x0,by+G.BARH-eh,w,eh); ctx.restore(); }
    ctx.fillStyle='#F4F6FA'; ctx.font='600 '+nf+'px '+FONT; const nx=G.x0+18; text('name',id,c.label,nx,mid+nf*0.35,'left');
    const nameOut=Math.max(0,(nx+ctx.measureText(c.label).width)-(G.x0+w));
    ctx.fillStyle=T.ink; ctx.font='600 '+G.VALF+'px '+FONT; const vt=netText(last.avg[id],1), tw=tabText(vt,G.x0+w+18+nameOut,mid+G.VALF*0.35,'left','value',id);
    ctx.fillStyle=T.cap||T.muted; ctx.font='500 '+G.VALF+'px '+FONT; const sn=last.seasons[id];
    tabText('· '+sn+' season'+(sn===1?'':'s'),G.x0+w+18+nameOut+tw+G.VALF*0.35,mid+G.VALF*0.35,'left','avg_seasons',id);
    window.__BARS.push({id, y:i, units:last.avg[id], seasons:sn, rect:{x:G.x0,y:by,w,h:G.BARH}});
  });
  ctx.fillStyle=T.foot; ctx.font='400 '+SZ.footer+'px '+FONT; text('footer',null,S.footer||CFG.footer||'',LEFT,1080-20,'left');
  for(const b of OVL) if(b.img){ const s2=Math.min(b.w/b.img.naturalWidth, b.h/b.img.naturalHeight); ctx.drawImage(b.img, b.x+(b.w-b.img.naturalWidth*s2)/2, b.y+(b.h-b.img.naturalHeight*s2)/2, b.img.naturalWidth*s2, b.img.naturalHeight*s2); }
  window.__STEP={name:'avgtable', order:ord};
}

function drawOutro(o){
  const a=Math.min(1, o/1.2);
  const BAND=1080-268;
  ctx.globalAlpha=a;
  let g=ctx.createLinearGradient(0,BAND-170,0,BAND-30);
  g.addColorStop(0,'rgba(6,10,18,0)'); g.addColorStop(1,'rgba(6,10,18,0.97)');
  ctx.fillStyle=g; ctx.fillRect(0,BAND-170,1920,140);
  ctx.fillStyle='rgba(6,10,18,0.97)'; ctx.fillRect(0,BAND-30,1920,1080-BAND+30);
  ctx.fillStyle=T.ink;   ctx.font='700 54px '+FONT;
  text('outro_q',null,CFG.outro_q||'',960,BAND+18,'center');
  ctx.fillStyle=T.cap||T.muted; ctx.font='500 34px '+FONT;
  text('outro_sub',null,CFG.outro_sub||'',960,BAND+68,'center');
  ctx.fillStyle=T.rule||T.accent; ctx.fillRect(0,BAND+104,1920,2);
  ctx.fillStyle=T.ink;  ctx.font='700 68px '+FONT;
  text('outro_cta',null,CFG.outro_cta||'',LEFT,BAND+186,'left');
  ctx.fillStyle=T.muted; ctx.font='400 28px '+FONT;
  text('outro_more',null,CFG.outro_more||'',LEFT,BAND+228,'left');
  ctx.globalAlpha=1;
}
