# Race Through Time - render the RTT-103 "The AI Spending Race" design round 1 (IQ-18): option stills, side-by-side
# contact sheets (c01..c13) and three pace clips, 1920 x 1080, no music.
#
# Its OWN workflow: render_pilot.yml (RTT-002), the RTT-003 and RTT-001 workflows are not changed, so nothing here can
# start another episode's render. This repository is PUBLIC (DEC-006). Its workflow logs and artifacts can be read by
# other people, so this workflow (as rtt001_pilot.yml, DEC-061):
#   - fetches Luke's logo and the company logos (identification only, kits/rtt-103/logos.json) from the PRIVATE repo
#     marketmarathon/race-through-time-private with the secret RTT_PRIVATE_TOKEN into $RUNNER_TEMP (outside the
#     checkout), never into the repo, and never prints the secret;
#   - checks their SHA-256 against kits/rtt-103/assets_sha256.txt and the player input against
#     kits/rtt-103/dataset_hashes.txt, and stops on any mismatch;
#   - renders the pace clips (kits/rtt-103/clips.txt) at 1920 x 1080 with NO audio track, and the stills
#     (kits/rtt-103/stills.json) at 1920 x 1080 plus phone size, and the side-by-side comparison sheets;
#   - saves everything ONLY as one pre-release in the private repo, with every file's SHA-256 in its notes;
#   - uploads NO workflow artifact, uses NO cache, and deletes frames and videos at the end.
# No full film is rendered (DEC-069: nothing beyond the approved look goes into a film before Luke approves it).
# Triggers: a push that changes THIS FILE on the IQ-18 branch, or by hand (once merged).
# Round 2 (IQ-18b, Luke's answers DEC-353..DEC-365): the film's chosen design with the steps after the race inside the
# player; 12 stills (each also at phone size), 2 contact sheets (d01, d02) and one clip from 2025 into the end (the last
# story cards, the hand-over into the 2026 plans step, the look-ahead, the peak step and the final table); tagged
# rtt-103-round2-<commit>-run<n>. Still no film and no music (Luke picks the track next).
# Round 3 (IQ-18c, Luke's direction DEC-371): the race carries straight on after June 2026 through the 2026 plans and
# the 2027-2030 estimates on the same board, then the explanation and the end as built; 7 stills (each also at phone
# size), one contact sheet (d01) and one clip from 2025 through 2030 into the end; tagged rtt-103-round3-<commit>-run<n>.
# Still no film and no music (the track is chosen, DEC-372; the film waits for Luke's OK of this look).
# Run 1 (de7759e) failed at the first clip: the RTT-103 configs had no crf/preset for ffmpeg (added to config_rtt103_base.json,
# crf 4 / slow as RTT-001; checked by tests/player/run_tests_rtt103.js). Run 2 renders the same stills, sheets and clips.
name: rtt103-pilot

on:
  push:
    branches: [claude/magical-einstein-hguyvv]
    paths: [.github/workflows/rtt103_pilot.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt103-pilot
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_REF: claude/magical-einstein-hguyvv
  # Round 2 (IQ-18b): every still and sheet in stills.json and the clip in clips.txt.
  # ONLY_STILLS empty = every still; ONLY_CLIPS empty = every clip in clips.txt, unless ONLY_STILLS is set (stills only).
  ONLY_STILLS: ''
  ONLY_CLIPS: ''
  TAG_PREFIX: rtt-103-round3

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg, the kit and Chromium
        working-directory: kits/rtt-002
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx playwright install --with-deps chromium

      - name: Check the player input and the frame counts
        working-directory: kits/rtt-002
        run: |
          want=$(awk '$2 == "output" && $3 ~ /race_rtt103.json$/ {print $1}' ../rtt-103/dataset_hashes.txt)
          got=$(sha256sum ../rtt-103/race_rtt103.json | cut -d' ' -f1)
          echo "race_rtt103.json $got (dataset_hashes.txt: $want)"
          test -n "$want" && test "$got" = "$want"
          : > "$RUNNER_TEMP/plan.txt"
          while read -r c; do
            test -n "$c" || continue
            test -f "../rtt-103/$c" || { echo "::error::no config $c"; exit 1; }
            f=$(RTT_CONFIG="../rtt-103/$c" FRAME_COUNT_ONLY=1 node rtt.js | awk '/^FRAMES/ {print $2}')
            test -n "$f"
            echo "$c $f" | tee -a "$RUNNER_TEMP/plan.txt"
          done < <(if [ -n "$ONLY_CLIPS" ]; then printf '%s\n' $ONLY_CLIPS; elif [ -n "$ONLY_STILLS" ]; then :; else cat ../rtt-103/clips.txt; fi)
          echo "the whole design without music, not rendered, config_rtt103_film.json: $(RTT_CONFIG=../rtt-103/config_rtt103_film.json FRAME_COUNT_ONLY=1 node rtt.js)"

      - name: Fetch Luke's logo and the company logos from the private repo and check their hashes
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          A="$RUNNER_TEMP/rtt_assets"; mkdir -p "$A/logos"
          : > "$RUNNER_TEMP/check.txt"
          grep -v '^#' kits/rtt-103/assets_sha256.txt | while read -r sum p; do
            case "$p" in
              assets/rtt-002/rtt_logo.png) dst="$A/rtt_logo.png";;
              assets/rtt-103/logos/*) dst="$A/logos/${p#assets/rtt-103/logos/}";;
              *) echo "::error::unexpected path $p"; exit 1;;
            esac
            # the logo branch, or the private main once Luke has merged it; the SHA-256 check below decides either way
            gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=$PRIVATE_REF" > "$dst" 2>/dev/null \
              || gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=main" > "$dst"
            printf '%s  %s\n' "$sum" "$dst" >> "$RUNNER_TEMP/check.txt"
          done
          sha256sum -c --quiet "$RUNNER_TEMP/check.txt"
          echo "$(wc -l < "$RUNNER_TEMP/check.txt") private file(s) fetched, SHA-256 checked"
          echo "RTT_LOCAL_ASSETS=$A" >> "$GITHUB_ENV"

      - name: Render the clips (1920 x 1080, no audio) and check every video
        run: |
          set -o pipefail
          O="$RUNNER_TEMP/rtt_out"; mkdir -p "$O"
          SHORT=${GITHUB_SHA::7}
          probe() { ffprobe -v error -select_streams v:0 -count_packets \
                      -show_entries stream=width,height,nb_read_packets,r_frame_rate -of csv=p=0 "$1"; }
          mapfile -t PLAN < "$RUNNER_TEMP/plan.txt"
          for line in "${PLAN[@]}"; do
            read -r c FRAMES <<< "$line"
            STEM="rtt103_${c#config_rtt103_}"; STEM="${STEM%.json}_${SHORT}_1920x1080"
            (cd kits/rtt-002 && SEG_OUT="$O/$STEM.mp4" RASTER_W=1920 RTT_CONFIG="../rtt-103/$c" node rtt.js | tee "$RUNNER_TEMP/render.log")
            if grep -q 'not found' "$RUNNER_TEMP/render.log"; then echo "::error::a logo or an overlay was not loaded"; exit 1; fi
            m=$(probe "$O/$STEM.mp4"); echo "$c: $m"
            test "$m" = "1920,1080,30/1,$FRAMES"
            a=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$O/$STEM.mp4" | wc -l)
            echo "$STEM.mp4: $a audio stream(s), want 0"; test "$a" = 0
          done

      - name: Render the stills (1920 x 1080 and phone size) and the comparison sheets
        run: |
          set -o pipefail
          node kits/rtt-103/render_stills.js "$RUNNER_TEMP/rtt_out" $ONLY_STILLS | tee "$RUNNER_TEMP/stills.log"
          if grep -q 'not found' "$RUNNER_TEMP/stills.log"; then echo "::error::a logo was not loaded"; exit 1; fi
          ls "$RUNNER_TEMP/rtt_out"/*.png | wc -l

      - name: Save the clips and stills as one pre-release in the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          O="$RUNNER_TEMP/rtt_out"; SHORT=${GITHUB_SHA::7}
          TAG="${TAG_PREFIX:-rtt-103-round3}-${SHORT}-run${GITHUB_RUN_NUMBER}"
          {
            echo "RTT-103 The AI Spending Race, design round 3 (IQ-18c): the race carries on after June 2026 through the 2026 plans and the 2027-2030 estimates in its own style (Luke's direction, DEC-371) - stills (each also at phone size), contact sheet d01, and one clip from 2025 through 2030 into the end. Rendered by GitHub Actions. No music. Not the film."
            echo
            echo "- Source: ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            while read -r c FRAMES; do
              echo "- kits/rtt-103/${c}: ${FRAMES} frames at 30 fps = $(awk -v f="$FRAMES" 'BEGIN {printf "%.1f", f / 30}') s, 1920 x 1080, x264, no audio"
            done < "$RUNNER_TEMP/plan.txt"
            echo "- Stills: kits/rtt-103/stills.json, 1920 x 1080 PNG plus the same frame at phone size (390 points wide at 3 device pixels per point); *_sheet.png = options side by side"
            echo "- Luke's logo and the company logos (identification only; kits/rtt-103/logos.json; Baidu from English Wikipedia, DEC-354): race-through-time-private, every SHA-256 checked against kits/rtt-103/assets_sha256.txt before drawing"
            echo "- Data: data/rtt-103 as merged by Luke on 8 Oct 2026 (pull request #20); no figure changed"
            echo "- File SHA-256:"
            (cd "$O" && sha256sum $(ls *.mp4 2>/dev/null) *.png | sed 's/^/  - /')
            echo
            echo "Private review render. Not for upload or publication (DEC-001). Not the film."
          } > "$O/notes.md"
          cat "$O/notes.md"
          gh release create "$TAG" --repo "$PRIVATE_REPO" --target main --prerelease \
            --title "RTT-103 design ${TAG_PREFIX:-rtt-103-round3} ${SHORT} (stills, sheet and the 2025-to-end clip)" --notes-file "$O/notes.md" $(ls "$O"/*.mp4 2>/dev/null) "$O"/*.png
          URL="https://github.com/${PRIVATE_REPO}/releases/tag/${TAG}"
          echo "Release: $URL"
          echo "RTT-103 round 1 saved to the private repo: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the logo, frames and videos from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt_assets" "$RUNNER_TEMP/rtt_out" "$RUNNER_TEMP/render.log" "$RUNNER_TEMP/stills.log" "$RUNNER_TEMP/check.txt"
