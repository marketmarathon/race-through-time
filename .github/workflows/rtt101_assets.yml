# Race Through Time - RTT-101 club crests (IQ-21, design round 1; owner decision DEC-700). Its own workflow: nothing
# here can start a render of any episode.
#
# Wikimedia answers HTTP 429 to the Claude Code cloud container, so every Premier League club's crest (data/rtt-101/
# clubs.csv) is looked up and downloaded here, on a GitHub-hosted runner, and committed straight into the PRIVATE repo
# (DEC-060), as RTT-001's and RTT-103's logos were. This repository is PUBLIC (DEC-006, DEC-061), so this workflow:
#   - pushes to the private repo with the secret RTT_PRIVATE_TOKEN, never printing it;
#   - keeps a file only if its downloaded SHA-1 equals the Wikipedia API's, and records page, licence or non-free
#     status, author, date, description, SHA-1 and SHA-256 in a manifest next to the files (copied into
#     kits/rtt-101/crests.json and reference/rights_ledger.md afterwards);
#   - uploads NO workflow artifact, uses NO cache and prints only titles, sizes, licences and hashes;
#   - deletes everything it downloaded from the runner at the end.
# Trigger: a push that changes this file or the fetch script on the IQ-21 branch, or by hand.
name: rtt101-assets

on:
  push:
    branches: [claude/loving-heisenberg-hypu42]
    paths: [.github/workflows/rtt101_assets.yml, scripts/rtt101_fetch_crests.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt101-assets
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_BRANCH: claude/loving-heisenberg-hypu42

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look up and download the crests, check SHA-1, commit to the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          W="$RUNNER_TEMP/rtt101"; mkdir -p "$W"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git" "$W/private"
          cd "$W/private"
          if git ls-remote --exit-code --heads origin "$PRIVATE_BRANCH" > /dev/null; then git checkout -q "$PRIVATE_BRANCH"; else git checkout -q -b "$PRIVATE_BRANCH" origin/main; fi
          cd "$GITHUB_WORKSPACE"
          rc=0; python3 scripts/rtt101_fetch_crests.py data/rtt-101/clubs.csv "$W/private/assets/rtt-101/crests" || rc=$?
          cd "$W/private"
          git config user.name "rtt101-assets workflow"
          git config user.email "rtt101-assets@users.noreply.github.com"
          git add assets/rtt-101/crests
          if git diff --cached --quiet; then echo "nothing new to commit"; exit $rc; fi
          git commit -q -m "RTT-101: club crests from Wikipedia and Commons, SHA-1 checked, identification only (IQ-21, DEC-700; source run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          git push -q origin "HEAD:$PRIVATE_BRANCH"
          echo "committed $(git rev-parse --short HEAD) to ${PRIVATE_REPO} ${PRIVATE_BRANCH}"
          exit $rc

      - name: Delete the downloads from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt101"
