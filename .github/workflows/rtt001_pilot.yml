# Race Through Time - render the RTT-001 Browser Wars design pilot 1 (IQ-13): clips and stills, 1920 x 1080, no music.
#
# Its OWN workflow: render_pilot.yml (RTT-002) and the RTT-003 workflows are not changed, so nothing here can start
# another episode's render. This repository is PUBLIC (DEC-006). Its workflow logs and artifacts can be read by other
# people, so this workflow (as rtt003_pilot.yml, DEC-061):
#   - fetches Luke's logo and the browser logos (owner direction DEC-180) from the PRIVATE repo
#     marketmarathon/race-through-time-private with the secret RTT_PRIVATE_TOKEN into $RUNNER_TEMP (outside the
#     checkout), never into the repo, and never prints the secret;
#   - checks its SHA-256 against kits/rtt-001/assets_sha256.txt and the player input against
#     kits/rtt-001/dataset_hashes.txt, and stops on any mismatch;
#   - renders the pilot clips (kits/rtt-001/clips.txt) at 1920 x 1080 with NO audio track, and the stills
#     (kits/rtt-001/stills.json) at 1920 x 1080 plus phone size, and the side-by-side comparison sheets;
#   - saves everything ONLY as one pre-release in the private repo, with every file's SHA-256 in its notes;
#   - uploads NO workflow artifact, uses NO cache, and deletes frames and videos at the end.
# No full film is rendered (DEC-069: nothing beyond the approved look goes into a film before Luke approves it).
# Triggers: a push that changes THIS FILE on the IQ-13 branch, or by hand (once merged).
# Run 1 (56b6f43): empty picture boxes. Run 2 (IQ-13b): browser logos in the picture boxes (owner direction DEC-180).
# Run 3 (IQ-13c): every browser on the board with a logo (owner decisions DEC-182); stills only (ONLY_STILLS).
# Pilot 2 (IQ-13 answers, 5 Oct 2026, DEC-184 to DEC-203): Luke's approved choices, and the board-size option side by
# side (fixed 10 slots or bars sized to the browsers on the board, DEC-188/DEC-202): the stills in ONLY_STILLS and the
# one clip in ONLY_CLIPS; tagged rtt-001-pilot2-<commit>-run<n>.
# Pilot 3 (date and era picture, DEC-214 to DEC-219): old vs option A vs option B at four months, the era-picture
# sheet, the side-by-side sheet, and a clip of A and of B across 2008-2009; tagged rtt-001-pilot3-<commit>-run<n>.
name: rtt001-pilot

on:
  push:
    branches: [claude/compassionate-cray-tlnnkm]
    paths: [.github/workflows/rtt001_pilot.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt001-pilot
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_REF: claude/compassionate-cray-tlnnkm
  # Pilot 3 (DEC-214..DEC-219): the date block and era picture, old vs option A vs option B; clips of A and B across 2008-2009.
  # ONLY_STILLS empty = every still; ONLY_CLIPS empty = every clip in clips.txt, unless ONLY_STILLS is set (stills only).
  ONLY_STILLS: e01_old_jun1996 e01_A_jun1996 e01_B_jun1996 e02_old_jun2004 e02_A_jun2004 e02_B_jun2004 e03_old_jun2010 e03_A_jun2010 e03_B_jun2010 e04_old_jun2020 e04_A_jun2020 e04_B_jun2020 s22_era_devices c10_date_era_old_A_B
  ONLY_CLIPS: config_rtt001_clip_era_A_2008_2009.json config_rtt001_clip_era_B_2008_2009.json
  TAG_PREFIX: rtt-001-pilot3

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg, the kit and Chromium
        working-directory: kits/rtt-002
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx playwright install --with-deps chromium

      - name: Check the player input and the frame counts
        working-directory: kits/rtt-002
        run: |
          want=$(awk '$2 == "output" && $3 ~ /race_rtt001.json$/ {print $1}' ../rtt-001/dataset_hashes.txt)
          got=$(sha256sum ../rtt-001/race_rtt001.json | cut -d' ' -f1)
          echo "race_rtt001.json $got (dataset_hashes.txt: $want)"
          test -n "$want" && test "$got" = "$want"
          : > "$RUNNER_TEMP/plan.txt"
          while read -r c; do
            test -n "$c" || continue
            test -f "../rtt-001/$c" || { echo "::error::no config $c"; exit 1; }
            f=$(RTT_CONFIG="../rtt-001/$c" FRAME_COUNT_ONLY=1 node rtt.js | awk '/^FRAMES/ {print $2}')
            test -n "$f"
            echo "$c $f" | tee -a "$RUNNER_TEMP/plan.txt"
          done < <(if [ -n "$ONLY_CLIPS" ]; then printf '%s\n' $ONLY_CLIPS; elif [ -n "$ONLY_STILLS" ]; then :; else cat ../rtt-001/clips.txt; fi)
          for c in film opt_A opt_B opt_C approved approved_fit; do echo "full film, not rendered, config_rtt001_$c.json: $(RTT_CONFIG=../rtt-001/config_rtt001_$c.json FRAME_COUNT_ONLY=1 node rtt.js)"; done

      - name: Fetch Luke's logo and the browser logos from the private repo and check their hashes
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          A="$RUNNER_TEMP/rtt_assets"; mkdir -p "$A/logos"
          : > "$RUNNER_TEMP/check.txt"
          grep -v '^#' kits/rtt-001/assets_sha256.txt | while read -r sum p; do
            case "$p" in
              assets/rtt-002/rtt_logo.png) dst="$A/rtt_logo.png";;
              assets/rtt-001/logos/*) dst="$A/logos/${p#assets/rtt-001/logos/}";;
              *) echo "::error::unexpected path $p"; exit 1;;
            esac
            # the logo branch, or the private main once Luke has merged it; the SHA-256 check below decides either way
            gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=$PRIVATE_REF" > "$dst" 2>/dev/null \
              || gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=main" > "$dst"
            printf '%s  %s\n' "$sum" "$dst" >> "$RUNNER_TEMP/check.txt"
          done
          sha256sum -c --quiet "$RUNNER_TEMP/check.txt"
          echo "$(wc -l < "$RUNNER_TEMP/check.txt") private file(s) fetched, SHA-256 checked"
          echo "RTT_LOCAL_ASSETS=$A" >> "$GITHUB_ENV"

      - name: Render the clips (1920 x 1080, no audio) and check every video
        run: |
          set -o pipefail
          O="$RUNNER_TEMP/rtt_out"; mkdir -p "$O"
          SHORT=${GITHUB_SHA::7}
          probe() { ffprobe -v error -select_streams v:0 -count_packets \
                      -show_entries stream=width,height,nb_read_packets,r_frame_rate -of csv=p=0 "$1"; }
          mapfile -t PLAN < "$RUNNER_TEMP/plan.txt"
          for line in "${PLAN[@]}"; do
            read -r c FRAMES <<< "$line"
            STEM="rtt001_${c#config_rtt001_}"; STEM="${STEM%.json}_${SHORT}_1920x1080"
            (cd kits/rtt-002 && SEG_OUT="$O/$STEM.mp4" RASTER_W=1920 RTT_CONFIG="../rtt-001/$c" node rtt.js | tee "$RUNNER_TEMP/render.log")
            if grep -q 'not found' "$RUNNER_TEMP/render.log"; then echo "::error::a logo or an overlay was not loaded"; exit 1; fi
            m=$(probe "$O/$STEM.mp4"); echo "$c: $m"
            test "$m" = "1920,1080,30/1,$FRAMES"
            a=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$O/$STEM.mp4" | wc -l)
            echo "$STEM.mp4: $a audio stream(s), want 0"; test "$a" = 0
          done

      - name: Render the stills (1920 x 1080 and phone size) and the comparison sheets
        run: |
          set -o pipefail
          node kits/rtt-001/render_stills.js "$RUNNER_TEMP/rtt_out" $ONLY_STILLS | tee "$RUNNER_TEMP/stills.log"
          if grep -q 'not found' "$RUNNER_TEMP/stills.log"; then echo "::error::a logo was not loaded"; exit 1; fi
          ls "$RUNNER_TEMP/rtt_out"/*.png | wc -l

      - name: Save the clips and stills as one pre-release in the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          O="$RUNNER_TEMP/rtt_out"; SHORT=${GITHUB_SHA::7}
          TAG="${TAG_PREFIX:-rtt-001-pilot1}-${SHORT}-run${GITHUB_RUN_NUMBER}"
          {
            echo "RTT-001 Browser Wars design pilot (${TAG_PREFIX:-rtt-001-pilot1}): clips and stills for Luke to choose from, rendered by GitHub Actions. No music. Not a film."
            echo
            echo "- Source: ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            while read -r c FRAMES; do
              echo "- kits/rtt-001/${c}: ${FRAMES} frames at 30 fps = $(awk -v f="$FRAMES" 'BEGIN {printf "%.1f", f / 30}') s, 1920 x 1080, x264, no audio"
            done < "$RUNNER_TEMP/plan.txt"
            echo "- Stills: kits/rtt-001/stills.json, 1920 x 1080 PNG plus the same frame at phone size (390 points wide at 3 device pixels per point); *_sheet.png = options side by side"
            echo "- Luke's logo and the browser logos (kits/rtt-001/logos.json; Lynx and NetFront on our own neutral tiles): race-through-time-private, every SHA-256 checked against kits/rtt-001/assets_sha256.txt before drawing"
            echo "- File SHA-256:"
            (cd "$O" && sha256sum $(ls *.mp4 2>/dev/null) *.png | sed 's/^/  - /')
            echo
            echo "Private review render. Not for upload or publication (DEC-001). Not the film."
          } > "$O/notes.md"
          cat "$O/notes.md"
          gh release create "$TAG" --repo "$PRIVATE_REPO" --target main --prerelease \
            --title "RTT-001 design ${TAG_PREFIX:-rtt-001-pilot1} ${SHORT} (clips and stills)" --notes-file "$O/notes.md" $(ls "$O"/*.mp4 2>/dev/null) "$O"/*.png
          URL="https://github.com/${PRIVATE_REPO}/releases/tag/${TAG}"
          echo "Release: $URL"
          echo "RTT-001 pilot saved to the private repo: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the logo, frames and videos from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt_assets" "$RUNNER_TEMP/rtt_out" "$RUNNER_TEMP/render.log" "$RUNNER_TEMP/stills.log" "$RUNNER_TEMP/check.txt"
