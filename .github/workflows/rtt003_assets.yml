# Race Through Time - RTT-003 pictures and logos (IQ-10). Separate from render_pilot.yml (RTT-002),
# so nothing here can start an RTT-002 render.
#
# Commons answers HTTP 429 to the Claude Code cloud container, so the console pictures and maker
# logos are downloaded here, on a GitHub-hosted runner, and committed straight into the PRIVATE repo
# (DEC-060). This repository is PUBLIC (DEC-006, DEC-061), so this workflow:
#   - reads the private picture list and pushes to the private repo with the secret RTT_PRIVATE_TOKEN,
#     never printing it;
#   - downloads only the rows named in kits/rtt-003/pictures.json (PICK rows; BACKUP only if a PICK
#     fails; never REJECT), and keeps a file only if its SHA-1 equals the list's and the Commons API's;
#   - uploads NO workflow artifact, uses NO cache and prints only names, sizes and hashes;
#   - deletes everything it downloaded from the runner at the end.
# Trigger: a push that changes this file or the fetch script on the IQ-10 branch, or by hand.
name: rtt003-assets

on:
  push:
    branches: [claude/sweet-mendel-faig7w]
    paths: [.github/workflows/rtt003_assets.yml, scripts/rtt003_fetch_pictures.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt003-assets
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_BRANCH: claude/sweet-mendel-faig7w
  LIST: research/rtt-003-images/RTT-003_images_reconciled_2026-09-30.csv

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download from Commons, check SHA-1, commit to the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          W="$RUNNER_TEMP/rtt003"; mkdir -p "$W"
          git clone -q --depth 1 --branch "$PRIVATE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git" "$W/private"
          python3 scripts/rtt003_fetch_pictures.py "$W/private/$LIST" kits/rtt-003/pictures.json "$W/private/assets/rtt-003"
          cd "$W/private"
          git config user.name "rtt003-assets workflow"
          git config user.email "rtt003-assets@users.noreply.github.com"
          git add assets/rtt-003/originals assets/rtt-003/logos assets/rtt-003/manifest.csv
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -q -m "RTT-003: console pictures and maker logos from Wikimedia Commons, SHA-1 checked (IQ-10; source run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          git push -q origin "HEAD:$PRIVATE_BRANCH"
          echo "committed $(git rev-parse --short HEAD) to ${PRIVATE_REPO} ${PRIVATE_BRANCH}"

      - name: Delete the downloads from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt003"
