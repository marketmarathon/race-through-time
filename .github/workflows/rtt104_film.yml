# Race Through Time - render the FULL RTT-104 Women in Parliament film (IQ-22b): the approved design (DEC-634..DEC-644,
# config kits/rtt-104/config_rtt104_film.json) with Luke's music, the way the RTT-003 film was made (rtt003_film.yml):
# a 3840 x 2160 master plus a 1920 x 1080 viewing copy, saved ONLY as a private pre-release.
#
# Music (IQ-22c, DEC-649): "No.10 A New Beginning" by Esther Abrami (YouTube Audio Library). The first job reads
# kits/rtt-104/music_rtt104.json and renders NOTHING unless it is complete (ready, title, artist, file, private_path,
# sha256, bytes, start_sec, fade_sec; loop points optional). The track is longer than the film: played once, no loop.
#
# Its OWN workflow: no other episode's workflow is changed, so nothing here can start another render. This repository
# is PUBLIC (DEC-006), so this workflow (DEC-061):
#   - fetches Luke's logo and the music from the PRIVATE repo with the secret RTT_PRIVATE_TOKEN into $RUNNER_TEMP
#     (outside the checkout), never into the repo, never printed; checks every SHA-256 and stops on any mismatch;
#   - before rendering: the data tests, the player input rebuilt from data/rtt-104, the whole-film value check
#     (tests/rtt104/film_check_rtt104.js: every year's figures, every leave note, the closing card) and the whole-film
#     WCAG flash check (tests/player/wcag_flash_rtt003.js on the film config); any failure stops the run;
#   - renders the film silent at 3840 x 2160, adds the music with scripts/rtt_mix_music.sh (unchanged, DEC-072/DEC-074:
#     looped on the beat at the given loop points, faded out over the closing card (fade_sec), -16 LUFS integrated,
#     true peak at most -1 dBTP, the script fails otherwise), makes a 1920 x 1080 viewing copy, checks and measures both;
#   - saves both videos ONLY as one pre-release in the private repo, with each file's SHA-256 in its notes;
#   - uploads NO workflow artifact, uses NO cache, and deletes the logo, music, frames and videos at the end.
# Nothing is uploaded to YouTube or published; Luke approves the exact render by its SHA-256 (DEC-078).
# Triggers: a push on the IQ-20/IQ-22 branch that changes this file or the music file (GitHub cannot start an unmerged
# workflow by hand), or by hand once merged.
name: rtt104-film

on:
  push:
    branches: [claude/nifty-brown-hrl2yi]
    paths: [.github/workflows/rtt104_film.yml, kits/rtt-104/music_rtt104.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt104-film
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_REF: main
  FILM: config_rtt104_film.json
  RASTER_W: '3840'

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.music.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: music
        name: Is Luke's music chosen? (no render until it is)
        run: |
          ready=$(python3 -c "
          import json, re
          m = json.load(open('kits/rtt-104/music_rtt104.json'))
          ok = m.get('ready') is True and all(m.get(k) not in (None, '') for k in ('title','artist','file','private_path','sha256','bytes','start_sec','fade_sec'))
          ok = ok and (m.get('loop_end') is None or all(m.get(k) is not None for k in ('loop_start','crossfade_sec')))
          ok = ok and bool(re.fullmatch(r'[0-9a-f]{64}', m['sha256'] or '')) and '/' not in m['file']
          print('true' if ok else 'false')")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then echo "::notice::kits/rtt-104/music_rtt104.json is still the placeholder: Luke has not chosen the music, so the film is NOT rendered."; fi

  render:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg, the kit and Chromium
        working-directory: kits/rtt-002
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx playwright install --with-deps chromium
          echo "PW_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Check the data, the player input, the music config and the frame count
        run: |
          python3 tests/rtt104/run_tests_rtt104.py | tail -1
          want=$(awk '$2 == "output" {print $1}' kits/rtt-104/dataset_hashes.txt)
          test "$(sha256sum kits/rtt-104/race_rtt104.json | cut -d' ' -f1)" = "$want"
          python3 scripts/rtt104_player_input.py data/rtt-104 "$RUNNER_TEMP/race_check.json" "$RUNNER_TEMP/hash_check.txt" > /dev/null
          test "$(sha256sum "$RUNNER_TEMP/race_check.json" | cut -d' ' -f1)" = "$want"
          python3 -c "
          import json; m = json.load(open('kits/rtt-104/music_rtt104.json'))
          e = lambda v: '' if v is None else v
          for k, v in [('MUSIC', m['file']), ('MUSIC_PATH', m['private_path']), ('MUSIC_SHA256', m['sha256']), ('MUSIC_BYTES', m['bytes']),
                       ('README_PATH', e(m.get('readme_path'))), ('README_BYTES', e(m.get('readme_bytes'))), ('README_PRE', e(m.get('readme_sha256_prefix'))),
                       ('README_SUF', e(m.get('readme_sha256_suffix'))), ('START', m['start_sec']), ('LOOP_START', e(m['loop_start'])),
                       ('LOOP_END', e(m['loop_end'])), ('XFADE', e(m['crossfade_sec'])), ('FADE', m['fade_sec']), ('MUSIC_TITLE', m['title'] + ' by ' + m['artist'])]:
              print(f'{k}={v}')" >> "$GITHUB_ENV"
          f=$(RTT_CONFIG="$FILM" FRAME_COUNT_ONLY=1 node kits/rtt-104/render_rtt104.js | awk '/^FRAMES/ {print $2}')
          test -n "$f"; echo "FRAMES=$f" >> "$GITHUB_ENV"
          echo "$FILM: $f frames = $(awk -v f="$f" 'BEGIN {printf "%.2f", f / 30}') s"

      - name: Fetch Luke's logo and the music from the private repo and check their hashes
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          A="$RUNNER_TEMP/rtt_assets"; M="$RUNNER_TEMP/rtt_music"; mkdir -p "$A" "$M"
          : > "$RUNNER_TEMP/check.txt"
          grep -v '^#' kits/rtt-104/assets_sha256.txt | while read -r sum p; do
            case "$p" in assets/rtt-002/rtt_logo.png) dst="$A/rtt_logo.png";; *) echo "::error::unexpected path $p"; exit 1;; esac
            gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=$PRIVATE_REF" > "$dst"
            printf '%s  %s\n' "$sum" "$dst" >> "$RUNNER_TEMP/check.txt"
          done
          gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$MUSIC_PATH?ref=$PRIVATE_REF" > "$M/$MUSIC"
          printf '%s  %s\n' "$MUSIC_SHA256" "$M/$MUSIC" >> "$RUNNER_TEMP/check.txt"
          sha256sum -c --quiet "$RUNNER_TEMP/check.txt"
          test "$(stat -c %s "$M/$MUSIC")" = "$MUSIC_BYTES"
          if [ -n "$README_PATH" ]; then
            gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$README_PATH?ref=$PRIVATE_REF" > "$M/README.txt"
            rs=$(sha256sum "$M/README.txt" | cut -d' ' -f1)
            test "$(stat -c %s "$M/README.txt")" = "$README_BYTES"; case "$rs" in "$README_PRE"*"$README_SUF") ;; *) echo "::error::README hash does not match"; exit 1;; esac
            echo "README_SHA256=$rs" >> "$GITHUB_ENV"; rm "$M/README.txt"
          fi
          # DEC-651 start: "auto" = 0 s unless the track opens with silence (below -50 dB for 0.2 s or more from 0 s)
          if [ "$START" = auto ]; then
            s0=$(ffmpeg -nostdin -hide_banner -t 20 -i "$M/$MUSIC" -af silencedetect=noise=-50dB:d=0.2 -f null - 2>&1 | python3 -c "
          import re, sys
          t = sys.stdin.read(); st = re.findall(r'silence_start: (-?[\d.]+)', t); en = re.findall(r'silence_end: ([\d.]+)', t)
          print(en[0] if st and float(st[0]) <= 0.05 and en else '0')")
            echo "start: auto -> ${s0} s"; echo "START=$s0" >> "$GITHUB_ENV"
          fi
          echo "$(wc -l < "$RUNNER_TEMP/check.txt") private files fetched (Luke's logo, music), SHA-256 checked"
          echo "RTT_LOCAL_ASSETS=$A" >> "$GITHUB_ENV"; echo "RTT_MUSIC_FILE=$M/$MUSIC" >> "$GITHUB_ENV"

      - name: Whole-film checks before the render (values, phone, overlaps, WCAG flash)
        run: |
          set -o pipefail
          node tests/rtt104/film_check_rtt104.js "$FILM" | tee "$RUNNER_TEMP/filmcheck.txt"
          node tests/player/wcag_flash_rtt003.js "../rtt-104/$FILM" 2>/dev/null | python3 -c "import sys,json; t=sys.stdin.read(); d=json.loads(t[t.index('{'):]); print('WCAG flash check (whole film, %d frames) %s: largest too-often-flashing area in a 10-degree field %d px of %d allowed (frame %s); red %d px' % (d['frames'], 'PASS' if d['pass'] else 'FAIL', d['worst']['fastG']['best'], d['limit_px_10deg'], d['worst']['fastG'].get('f'), d['worst']['fastR']['best'])); sys.exit(0 if d['pass'] else 1)" | tee "$RUNNER_TEMP/flash.txt"

      - name: Render the film (3840 x 2160), add the music, make the viewing copy, check and measure both
        run: |
          set -o pipefail
          O="$RUNNER_TEMP/rtt_out"; mkdir -p "$O"
          SHORT=${GITHUB_SHA::7}; STEM="rtt104_film_${SHORT}"
          probe() { ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=width,height,nb_read_packets,r_frame_rate -of csv=p=0 "$1"; }
          audio() { ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$1" | wc -l; }
          SEG_OUT="$O/silent.mp4" RASTER_W="$RASTER_W" RTT_CONFIG="$FILM" node kits/rtt-104/render_rtt104.js | tee "$RUNNER_TEMP/render.log"
          if grep -q 'not found' "$RUNNER_TEMP/render.log"; then echo "::error::the logo was not loaded"; exit 1; fi
          m=$(probe "$O/silent.mp4"); echo "silent master: $m"; test "$m" = "3840,2160,30/1,$FRAMES"
          MASTER="$O/${STEM}_3840x2160.mp4"; VIEW="$O/${STEM}_1920x1080_viewing.mp4"
          # the track from START (lossless cut to PCM), then the unchanged mix script: played once (or looped if loop points are given)
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss "$START" -i "$RTT_MUSIC_FILE" -c:a pcm_s24le "$RUNNER_TEMP/rtt_music/from_start.wav"
          if [ -n "$LOOP_END" ]; then LA=("$LOOP_START" "$LOOP_END" "$XFADE"); else LA=(); fi
          scripts/rtt_mix_music.sh "$O/silent.mp4" "$RUNNER_TEMP/rtt_music/from_start.wav" "$MASTER" "$FADE" "${LA[@]}" 2>&1 | tee "$RUNNER_TEMP/mix.log"
          rm "$O/silent.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$MASTER" -map 0:v:0 -map 0:a:0 \
            -vf scale=1920:1080:flags=lanczos -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 -c:a copy -movflags +faststart "$VIEW"
          v=$(probe "$VIEW"); echo "viewing copy: $v"; test "$v" = "1920,1080,30/1,$FRAMES"
          : > "$RUNNER_TEMP/measure.txt"
          for f in "$MASTER" "$VIEW"; do
            test "$(audio "$f")" = 1
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -nostdin -hide_banner -nostats -i "$f" -map 0:a:0 -af ebur128=peak=true -f null - 2> "$RUNNER_TEMP/m.txt"
            python3 - "$RUNNER_TEMP/m.txt" "$(basename "$f")" "$d" <<'PY' | tee -a "$RUNNER_TEMP/measure.txt"
          import re, sys
          t = open(sys.argv[1]).read(); s = t[t.rindex('Summary:'):]
          i = float(re.search(r'I:\s+(-?[\d.]+) LUFS', s).group(1)); tp = float(re.search(r'True peak:\s+Peak:\s+(-?[\d.]+) dBFS', s).group(1))
          print(f"{sys.argv[2]}: {float(sys.argv[3]):.3f} s, 1 audio track, {i} LUFS integrated, true peak {tp} dBTP")
          sys.exit(0 if abs(i + 16) <= 1 and tp <= -1.0 else 1)
          PY
          done
          grep -o 'loop: .*' "$RUNNER_TEMP/mix.log" > "$RUNNER_TEMP/joins.txt" || true

      - name: Save both videos as one pre-release in the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          O="$RUNNER_TEMP/rtt_out"; SHORT=${GITHUB_SHA::7}
          TAG="rtt-104-film-${SHORT}-run${GITHUB_RUN_NUMBER}"
          {
            echo "RTT-104 Women in Parliament: Highest vs Lowest (1997-2025): FULL FILM, rendered by GitHub Actions."
            echo
            echo "- Source: ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- kits/rtt-104/${FILM}: ${FRAMES} frames at 30 fps = $(awk -v f="$FRAMES" 'BEGIN {printf "%.2f", f / 30}') s; the approved design (DEC-634..DEC-644)"
            echo "- Master 3840x2160 (x264 slow CRF 4, as RTT-002 and RTT-003); viewing copy 1920x1080 (x264 CRF 18)"
            echo "- Before the render: $(tail -1 "$RUNNER_TEMP/filmcheck.txt"); $(cat "$RUNNER_TEMP/flash.txt")"
            echo "- Audio: \"${MUSIC_TITLE}\" (YouTube Audio Library, attribution not required), ${MUSIC_PATH}, ${MUSIC_BYTES} bytes, SHA-256 ${MUSIC_SHA256} (checked); README SHA-256 ${README_SHA256:-none}; played once from ${START} s $( [ -n "$LOOP_END" ] && echo "with loop ${LOOP_START}-${LOOP_END} s" ), faded out over the last ${FADE} s, AAC 320 kb/s"
            echo "- $(cat "$RUNNER_TEMP/joins.txt")"
            echo "- Measured after encoding:"
            sed 's/^/  - /' "$RUNNER_TEMP/measure.txt"
            echo "- Video SHA-256 and size:"
            (cd "$O" && for f in *.mp4; do echo "  - $(sha256sum "$f" | cut -d' ' -f1)  $f  $(stat -c %s "$f") bytes"; done)
            echo
            echo "Private review render. Not for upload or publication until Luke approves the exact file by its SHA-256 (DEC-078)."
          } > "$O/notes.md"
          cat "$O/notes.md"
          gh release create "$TAG" --repo "$PRIVATE_REPO" --target main --prerelease \
            --title "RTT-104 full film ${SHORT} (3840x2160 + 1920x1080, music)" --notes-file "$O/notes.md" "$O"/*.mp4
          echo "Release: https://github.com/${PRIVATE_REPO}/releases/tag/${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the logo, music, frames and videos from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt_assets" "$RUNNER_TEMP/rtt_music" "$RUNNER_TEMP/rtt_out" "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/check.txt"
