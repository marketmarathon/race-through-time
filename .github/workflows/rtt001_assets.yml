# Race Through Time - RTT-001 browser logos (IQ-13b, owner direction DEC-180). Its own workflow: nothing here can
# start a render of any episode.
#
# upload.wikimedia.org (and its robot policy) refuses the Claude Code cloud container, so the logos listed in
# kits/rtt-001/logos.json are downloaded here, on a GitHub-hosted runner, and committed straight into the PRIVATE
# repo (DEC-060). This repository is PUBLIC (DEC-006, DEC-061), so this workflow:
#   - pushes to the private repo with the secret RTT_PRIVATE_TOKEN, never printing it;
#   - keeps a file only if its SHA-1 equals logos.json's (read at the file page) and the wiki API's, or, for a maker's
#     own file, its SHA-256 equals logos.json's;
#   - uploads NO workflow artifact, uses NO cache and prints only names, sizes and hashes;
#   - deletes everything it downloaded from the runner at the end.
# Trigger: a push that changes this file or the fetch script on the IQ-13 branch, or by hand.
# Run 2 (IQ-13c, DEC-182): every browser on the board gets a logo - adds English Wikipedia non-free files, Apple's
# Safari icon and the IE6 file (cropped at draw time only).
name: rtt001-assets

on:
  push:
    branches: [claude/compassionate-cray-tlnnkm]
    paths: [.github/workflows/rtt001_assets.yml, scripts/rtt001_fetch_logos.py]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt001-assets
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_BRANCH: claude/compassionate-cray-tlnnkm

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download from Commons, check SHA-1, commit to the private repo
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          W="$RUNNER_TEMP/rtt001"; mkdir -p "$W"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRIVATE_REPO}.git" "$W/private"
          cd "$W/private"
          if git ls-remote --exit-code --heads origin "$PRIVATE_BRANCH" > /dev/null; then git checkout -q "$PRIVATE_BRANCH"; else git checkout -q -b "$PRIVATE_BRANCH" origin/main; fi
          cd "$GITHUB_WORKSPACE"
          python3 scripts/rtt001_fetch_logos.py kits/rtt-001/logos.json "$W/private/assets/rtt-001/logos"
          cd "$W/private"
          git config user.name "rtt001-assets workflow"
          git config user.email "rtt001-assets@users.noreply.github.com"
          git add assets/rtt-001/logos
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -q -m "RTT-001: browser logos from Wikimedia Commons, SHA-1 checked (IQ-13b; source run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          git push -q origin "HEAD:$PRIVATE_BRANCH"
          echo "committed $(git rev-parse --short HEAD) to ${PRIVATE_REPO} ${PRIVATE_BRANCH}"

      - name: Delete the downloads from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt001"
