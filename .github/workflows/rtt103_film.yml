# Race Through Time - render the FULL RTT-103 "The AI Spending Race" film (IQ-18e): the approved round-3 design
# (Luke, DEC-376..DEC-378; kits/rtt-103/config_rtt103_film.json: the race to June 2026, then the 2026 plans and the
# 2027-2030 estimates flowing on in the race's own style, the explanation, the combined line, the peak timeline and
# the final June 2026 table) with Luke's music "The Fifth Quadrant" (DEC-372), the way the RTT-001 and RTT-003 films
# were made (rtt001_film.yml, rtt003_film.yml): a 3840 x 2160 master plus a 1920 x 1080 viewing copy, saved ONLY as a
# private pre-release.
#
# Its OWN workflow: render_pilot.yml (RTT-002), the RTT-001/RTT-003 workflows and rtt103_pilot.yml are not changed, so
# nothing here can start another render. This repository is PUBLIC (DEC-006), so this workflow (DEC-061):
#   - fetches the company logos, Luke's logo and the music from the PRIVATE repo with the secret RTT_PRIVATE_TOKEN into
#     $RUNNER_TEMP (outside the checkout), never into the repo, never printed;
#   - checks every SHA-256 (logos: kits/rtt-103/assets_sha256.txt; player input: kits/rtt-103/dataset_hashes.txt; music:
#     kits/rtt-103/music_rtt103.json) and stops on any mismatch;
#   - the track (169.59 s) is shorter than the film, so it is looped on the beat with one crossfade (loop points in
#     music_rtt103.json, DEC-379); it stops if a track shorter than the film has no loop points;
#   - checks the whole film against the WCAG 2.x general-flash and red-flash thresholds before rendering
#     (tests/player/wcag_flash_rtt003.js, DEC-149, DEC-212) and stops if it fails;
#   - renders the film silent at 3840 x 2160, then adds the music with scripts/rtt_mix_music.sh (unchanged,
#     DEC-072/DEC-074): faded out over the 10 s final table, about -16 LUFS integrated, true peak at most -1 dBTP;
#   - makes a 1920 x 1080 viewing copy (x264 CRF 18), checks both videos (size, frame count, one audio track) and
#     measures both again (loudness, true peak);
#   - saves both videos ONLY as one pre-release in the private repo, with each file's SHA-256 in its notes;
#   - uploads NO workflow artifact, uses NO cache, and deletes logos, music, frames and videos at the end.
# Nothing is uploaded to YouTube or published; Luke approves the exact render by its SHA-256 (DEC-078).
# Triggers: a push that changes THIS FILE on the IQ-18 branch, or by hand once merged.
name: rtt103-film

on:
  push:
    branches: [claude/magical-einstein-hguyvv]
    paths: [.github/workflows/rtt103_film.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtt103-film
  cancel-in-progress: false

env:
  PRIVATE_REPO: marketmarathon/race-through-time-private
  PRIVATE_REF: claude/magical-einstein-hguyvv
  FILM: config_rtt103_film.json
  RASTER_W: '3840'

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Music gate - render only once Luke's track is recorded (DEC-372)
        id: gate
        run: |
          r=$(python3 -c "import json; m=json.load(open('kits/rtt-103/music_rtt103.json')); print('true' if m.get('ready') is True else 'false')")
          echo "ready=$r" >> "$GITHUB_OUTPUT"
          if [ "$r" != true ]; then
            echo "::notice::Waiting for Luke's track: kits/rtt-103/music_rtt103.json is not ready. Nothing rendered."
            echo "RTT-103 film: waiting for Luke's music track (kits/rtt-103/music_rtt103.json not ready); nothing rendered." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Install ffmpeg, the kit and Chromium
        if: steps.gate.outputs.ready == 'true'
        working-directory: kits/rtt-002
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
          npx playwright install --with-deps chromium

      - name: Check the player input, the music record and the frame count
        if: steps.gate.outputs.ready == 'true'
        working-directory: kits/rtt-002
        run: |
          want=$(awk '$2 == "output" && $3 ~ /race_rtt103.json$/ {print $1}' ../rtt-103/dataset_hashes.txt)
          got=$(sha256sum ../rtt-103/race_rtt103.json | cut -d' ' -f1)
          echo "race_rtt103.json $got (dataset_hashes.txt: $want)"
          test -n "$want" && test "$got" = "$want"
          node -e "const m=require('../rtt-103/music_rtt103.json');
            if(!/^[0-9a-f]{64}$/.test(m.sha256||'')||!m.file||m.file.includes('/')||!m.private_path||!m.private_ref||!m.title||!m.artist||!m.source) process.exit(1);
            for (const [k,v] of [['MUSIC',m.file],['MUSIC_PATH',m.private_path],['MUSIC_REF',m.private_ref],['MUSIC_SHA256',m.sha256],['LOOP_START',m.loop_start??''],['LOOP_END',m.loop_end??''],['XFADE',m.crossfade_sec??'']]) console.log(k+'='+v)" >> "$GITHUB_ENV"
          echo "music: $(node -e "const m=require('../rtt-103/music_rtt103.json');console.log(m.title+' / '+m.artist+(m.loop_end?', loop '+m.loop_start+'-'+m.loop_end+' s, crossfade '+m.crossfade_sec+' s':', played once from its start'))")"
          f=$(RTT_CONFIG="../rtt-103/$FILM" FRAME_COUNT_ONLY=1 node rtt.js | awk '/^FRAMES/ {print $2}')
          hold=$(node -e "const c=require('./rtt.js').loadConfig('../rtt-103/$FILM');const s=c.steps.sequence;if(s[s.length-1].name!=='final')process.exit(1);console.log(s[s.length-1].sec)")
          test -n "$f" && test -n "$hold"
          echo "FRAMES=$f" >> "$GITHUB_ENV"; echo "HOLD=$hold" >> "$GITHUB_ENV"
          echo "$FILM: $f frames = $(awk -v f="$f" 'BEGIN {printf "%.2f", f / 30}') s, final table $hold s"

      - name: Fetch the logos and the music from the private repo and check their hashes
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::secret RTT_PRIVATE_TOKEN is not available to this run"; exit 1; fi
          A="$RUNNER_TEMP/rtt_assets"; mkdir -p "$A/logos"
          : > "$RUNNER_TEMP/check.txt"
          grep -v '^#' kits/rtt-103/assets_sha256.txt | while read -r sum p; do
            case "$p" in
              assets/rtt-002/rtt_logo.png) dst="$A/rtt_logo.png";;
              assets/rtt-103/logos/*) dst="$A/logos/${p#assets/rtt-103/logos/}";;
              *) echo "::error::unexpected path $p"; exit 1;;
            esac
            # the logo branch, or the private main once Luke has merged it; the SHA-256 check below decides either way
            gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=$PRIVATE_REF" > "$dst" 2>/dev/null \
              || gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$p?ref=main" > "$dst"
            printf '%s  %s\n' "$sum" "$dst" >> "$RUNNER_TEMP/check.txt"
          done
          M="$RUNNER_TEMP/rtt_music"; mkdir -p "$M"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$PRIVATE_REPO/contents/$MUSIC_PATH?ref=$MUSIC_REF" > "$M/$MUSIC"
          printf '%s  %s\n' "$MUSIC_SHA256" "$M/$MUSIC" >> "$RUNNER_TEMP/check.txt"
          sha256sum -c --quiet "$RUNNER_TEMP/check.txt"
          echo "$(wc -l < "$RUNNER_TEMP/check.txt") private files fetched (logos, Luke's logo, music), all SHA-256 checked"
          echo "RTT_LOCAL_ASSETS=$A" >> "$GITHUB_ENV"; echo "RTT_MUSIC_FILE=$M/$MUSIC" >> "$GITHUB_ENV"
          td=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$M/$MUSIC")
          fd=$(awk -v f="$FRAMES" 'BEGIN {printf "%.3f", f / 30}')
          echo "track ${td} s, film ${fd} s"
          if [ -z "$LOOP_END" ] && awk -v t="$td" -v f="$fd" 'BEGIN {exit !(t < f)}'; then
            echo "::error::the track (${td} s) is shorter than the film (${fd} s) and music_rtt103.json has no loop points"; exit 1
          fi

      - name: WCAG 2.x flash check of the whole film before rendering (as RTT-003, DEC-149)
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          # every frame drawn in order at 1920 x 1080 with the real logos; every pixel followed (general and red flash);
          # fails if too-often-flashing pixels ever cover more than 25% of a 10-degree field (57,600 px)
          # the script defaults to the Claude Code container's Chromium; on the runner, use the one Playwright installed
          export PW_CHROME=$(cd kits/rtt-002 && node -e "console.log(require('playwright').chromium.executablePath())")
          test -x "$PW_CHROME"
          node tests/player/wcag_flash_rtt003.js ../rtt-103/$FILM > "$RUNNER_TEMP/flash.json"
          cat "$RUNNER_TEMP/flash.json"
          python3 - "$RUNNER_TEMP/flash.json" > "$RUNNER_TEMP/flash.txt" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"WCAG 2.x flash check (tests/player/wcag_flash_rtt003.js, every frame, every pixel): {'PASS' if r['pass'] else 'FAIL'}; "
                f"largest too-often-flashing area in a 10-degree field {r['worst']['fastG']['best']} px general, {r['worst']['fastR']['best']} px red, "
                f"limit {r['limit_px_10deg']} px (25%)")
          PY
          cat "$RUNNER_TEMP/flash.txt"

      - name: Render the film (3840 x 2160), add the music, make the viewing copy, check and measure both
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -o pipefail
          O="$RUNNER_TEMP/rtt_out"; mkdir -p "$O"
          SHORT=${GITHUB_SHA::7}; STEM="rtt103_film_${SHORT}"
          probe() { ffprobe -v error -select_streams v:0 -count_packets \
                      -show_entries stream=width,height,nb_read_packets,r_frame_rate -of csv=p=0 "$1"; }
          audio() { ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$1" | wc -l; }
          (cd kits/rtt-002 && SEG_OUT="$O/silent.mp4" RASTER_W="$RASTER_W" RTT_CONFIG="../rtt-103/$FILM" node rtt.js | tee "$RUNNER_TEMP/render.log")
          if grep -q 'not found' "$RUNNER_TEMP/render.log"; then echo "::error::a logo or an overlay was not loaded"; exit 1; fi
          m=$(probe "$O/silent.mp4"); echo "silent master: $m"; test "$m" = "3840,2160,30/1,$FRAMES"
          MASTER="$O/${STEM}_3840x2160.mp4"; VIEW="$O/${STEM}_1920x1080_viewing.mp4"
          if [ -n "$LOOP_END" ]; then
            scripts/rtt_mix_music.sh "$O/silent.mp4" "$RTT_MUSIC_FILE" "$MASTER" "$HOLD" "$LOOP_START" "$LOOP_END" "$XFADE" 2>&1 | tee "$RUNNER_TEMP/mix.log"
          else
            scripts/rtt_mix_music.sh "$O/silent.mp4" "$RTT_MUSIC_FILE" "$MASTER" "$HOLD" 2>&1 | tee "$RUNNER_TEMP/mix.log"
          fi
          rm "$O/silent.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error -y -i "$MASTER" -map 0:v:0 -map 0:a:0 \
            -vf scale=1920:1080:flags=lanczos -c:v libx264 -preset slow -crf 18 -pix_fmt yuv420p \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 -c:a copy -movflags +faststart "$VIEW"
          v=$(probe "$VIEW"); echo "viewing copy: $v"; test "$v" = "1920,1080,30/1,$FRAMES"
          : > "$RUNNER_TEMP/measure.txt"
          for f in "$MASTER" "$VIEW"; do
            a=$(audio "$f"); test "$a" = 1
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -nostdin -hide_banner -nostats -i "$f" -map 0:a:0 -af ebur128=peak=true -f null - 2> "$RUNNER_TEMP/m.txt"
            python3 - "$RUNNER_TEMP/m.txt" "$(basename "$f")" "$d" <<'PY' | tee -a "$RUNNER_TEMP/measure.txt"
          import re, sys
          t = open(sys.argv[1]).read(); s = t[t.rindex('Summary:'):]
          i = float(re.search(r'I:\s+(-?[\d.]+) LUFS', s).group(1)); tp = float(re.search(r'True peak:\s+Peak:\s+(-?[\d.]+) dBFS', s).group(1))
          print(f"{sys.argv[2]}: {float(sys.argv[3]):.3f} s, 1 audio track, {i} LUFS integrated, true peak {tp} dBTP")
          sys.exit(0 if abs(i + 16) <= 1 and tp <= -1.0 else 1)
          PY
          done
          grep -o 'loop: .*' "$RUNNER_TEMP/mix.log" > "$RUNNER_TEMP/joins.txt" || echo "played once from its start, no loop" > "$RUNNER_TEMP/joins.txt"
          cat "$RUNNER_TEMP/joins.txt"

      - name: Save both videos as one pre-release in the private repo
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RTT_PRIVATE_TOKEN }}
        run: |
          O="$RUNNER_TEMP/rtt_out"; SHORT=${GITHUB_SHA::7}
          TAG="rtt-103-film-${SHORT}-run${GITHUB_RUN_NUMBER}"
          TRACK=$(python3 -c "import json; m=json.load(open('kits/rtt-103/music_rtt103.json')); print('\"%s\" by %s (%s)' % (m['title'], m['artist'], m['source']))")
          {
            echo "RTT-103 The AI Spending Race (Big Tech's capital spending, 12 months to June 2026, then 2026 plans and 2027-2030 estimates): FULL FILM, rendered by GitHub Actions."
            echo
            echo "- Source: ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} (${GITHUB_REF_NAME}), run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- kits/rtt-103/${FILM}: ${FRAMES} frames at 30 fps = $(awk -v f="$FRAMES" 'BEGIN {printf "%.2f", f / 30}') s (final table ${HOLD} s); Luke's answers DEC-353..DEC-365, DEC-371, DEC-376..DEC-378; built DEC-373, DEC-379"
            echo "- Master 3840x2160; viewing copy 1920x1080 (x264 CRF 18)"
            echo "- Logos: race-through-time-private, every SHA-256 checked against kits/rtt-103/assets_sha256.txt before drawing"
            echo "- Data: data/rtt-103 as merged by Luke on 8 Oct 2026 (pull request #20); no figure changed"
            echo "- Audio: ${TRACK}, ${MUSIC_PATH} SHA-256 ${MUSIC_SHA256} (checked); faded out over the final table, AAC 320 kb/s"
            echo "- $(cat "$RUNNER_TEMP/joins.txt")"
            echo "- $(cat "$RUNNER_TEMP/flash.txt")"
            echo "- Measured after encoding:"
            sed 's/^/  - /' "$RUNNER_TEMP/measure.txt"
            echo "- Video SHA-256:"
            (cd "$O" && sha256sum *.mp4 | sed 's/^/  - /')
            echo
            echo "Private review render. Not for upload or publication until Luke approves the exact file by its SHA-256 (DEC-001, DEC-078)."
          } > "$O/notes.md"
          cat "$O/notes.md"
          gh release create "$TAG" --repo "$PRIVATE_REPO" --target main --prerelease \
            --title "RTT-103 full film ${SHORT} (3840x2160 + 1920x1080, music)" --notes-file "$O/notes.md" "$O"/*.mp4
          URL="https://github.com/${PRIVATE_REPO}/releases/tag/${TAG}"
          echo "Release: $URL"
          echo "RTT-103 full film saved to the private repo: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the logos, music, frames and videos from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/rtt_assets" "$RUNNER_TEMP/rtt_music" "$RUNNER_TEMP/rtt_out" "$RUNNER_TEMP/render.log" "$RUNNER_TEMP/mix.log" "$RUNNER_TEMP/check.txt"
